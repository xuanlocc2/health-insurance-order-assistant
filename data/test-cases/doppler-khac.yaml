# Siêu âm doppler tim, van tim (18.0052.0004), DM2 mục 48: không thanh toán khi làm cùng thời điểm với siêu âm tim cản âm.
# "Cùng thời điểm" tạm = cùng lượt khám (M-11). Mã siêu âm tim cản âm chưa tra → ma: null.

- id: DOP-01
  ten: "Doppler tim đơn thuần, tiếng thổi"
  benh_nhan: { tuoi_thang: 6 }
  icd: [R01.1]
  sinh_hieu: { nhiet_do: 36.8, mach: 130, nhip_tho: 36 }
  phieu_kham: "Khám sức khỏe, phát hiện thổi tâm thu 2/6 bờ trái xương ức. Bú tốt, tăng cân đều."
  chi_dinh: [{ ma: "18.0052.0004", ten: "Siêu âm doppler tim, van tim" }]
  ky_vong:
    - { ma: "18.0052.0004", trang_thai: "Phù hợp quy tắc BHYT" }
  diem_mo_ho: [M-11]

- id: DOP-02
  ten: "Doppler + siêu âm tim cản âm cùng lượt"
  benh_nhan: { tuoi_thang: 48 }
  icd: [Q21.1]
  sinh_hieu: { nhiet_do: 36.7, mach: 105, nhip_tho: 24 }
  phieu_kham: "Theo dõi thông liên nhĩ. Chỉ định siêu âm tim cản âm đánh giá luồng thông."
  chi_dinh:
    - { ma: "18.0052.0004", ten: "Siêu âm doppler tim, van tim" }
