  ky_vong:
    - { ma: "18.0052.0004", trang_thai: "Không được chi trả", ly_do: "Làm cùng lượt với siêu âm tim cản âm" }
    - { ten: "Siêu âm tim cản âm", trang_thai: "Cần xem lại", ly_do: "Ngoài danh sách MVP, chưa tra" }
  diem_mo_ho: [M-11]

