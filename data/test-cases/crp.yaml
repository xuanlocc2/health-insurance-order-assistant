# CRP — Định lượng CRP (23.0228.1483), TT 35/2016 sđ TT 39/2024, DM1 mục 7.
# Nhánh trẻ em (a): V1 nhiệt độ ≤ 36 hoặc ≥ 38,3 (rule) · V2 nhịp tim HOẶC nhịp thở quá giới hạn theo tuổi (rule) · V3 nghi ổ nhiễm trùng (ai).
# Nhánh b: nhiễm trùng sơ sinh (≤ 28 ngày, M-06). Nhánh c, d: chưa áp dụng (M-07).
# Ngưỡng nhịp thở tạm (M-02): < 2 tháng ≥ 60; 2–11 tháng ≥ 50; 1–5 tuổi ≥ 40; > 5 tuổi: chưa có.
# Nhịp tim (thang Úc, RACGP; docs/10 GD-08): 0–1 tuổi ≥ 161; 1–2 tuổi ≥ 151; 2–5 tuổi ≥ 141; 5–6 tuổi ≥ 121; ≥ 6 tuổi: chưa có.
