# Danh mục 50 mục dịch vụ Nhi ngoại trú (R1), 55 dòng (STT 4, 32, 35, 41 tách nhiều dòng). SINH TỰ ĐỘNG từ text PL01 TT 23/2024 và QĐ 3500; nguồn và trích dẫn: NGUON.md.
# bhyt: co | dieu_kien (xem dieu-kien.yaml) | khong_thay | xac_minh. `ten` = tên đúng trong PL01 (dòng ma: null: tên trong danh sách đề xuất).
# can_cu[].trang = số trang PDF. stt_de_xuat = số dòng trong data/danh-muc/nhi-ngoai-tru-de-xuat.md.
phien_ban: '2026-11-13'
pham_vi_da_tra:
  PL01: 'TT 23/2024/TT-BYT Phụ lục 01 (danh mục kỹ thuật): tra đúng mã kỹ thuật cột 2 và tên; `ten` chép từ đây.'
  QD3500: 'QĐ 3500/QĐ-BYT (bảng giá BV Nhi TW): tra đúng mã đầy đủ XX.YYYY.ZZZZ; chỉ để đối chiếu mã, không phải giá Vinmec.'
  DM1: 'Danh mục 1 TT 35/2016 (VBHN 17/VBHN-BYT, 15 mục) và phần sửa đổi tại phụ lục TT 39/2024: đọc tuần tự toàn bộ, không chỉ tìm từ khóa.'
  DM2: 'Danh mục 2 TT 35/2016 (VBHN 17/VBHN-BYT, 109 mục) và phần sửa đổi tại phụ lục TT 39/2024: đọc tuần tự toàn bộ.'
  DM3: 'Danh mục 3 TT 35/2016 (VBHN 17/VBHN-BYT trang 52, 16 mục, đọc trên ảnh trang): không dịch vụ nào trong danh sách thuộc Danh mục 3.'
  bi_danh: Bí danh là tên gọi tắt do nhóm tự đặt để khớp tên chỉ định, không phải tên trong văn bản.
  chi_tiet: Xem NGUON.md.
