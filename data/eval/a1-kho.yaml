# Bộ đánh giá KHÓ cho A1 (đọc phiếu khám theo vế + trích số đo). Xem README.md cùng thư mục.
# Dữ liệu giả, nhóm tự dựng 13/11/2026, BÁC SĨ CHƯA DUYỆT. Nhãn theo spec 09 mục 2, 7 và cách hiểu tạm ở docs/06.
# Mục tiêu: bắt lỗi "dat" SAI (nói có căn cứ khi không có) và số liệu trích nhầm.
#
# Khác với data/test-cases:
#   - ky_vong chỉ liệt kê vế AI (kiem_bang: ai). Runner hỏi A1 đúng các vế này (khóa "{thu_tu}:{id}").
#     Không có trang_thai / he_chi_rule: bộ này đo A1, không đo engine.
#   - Trường số xin A1 trích = mọi trường đang null trong sinh_hieu (nhiet_do °C, mach l/p, nhip_tho l/p).
#   - a1_ky_vong_so_lieu: số A1 phải trích. Trường được xin mà không có ở đây = KHÔNG được trả.
#       chap_nhan_trong: true → bỏ trống cũng chấp nhận (verify() hiện loại số dính liền kiểu "39độ5"); trả số khác vẫn là sai.
#   - trich_dan: căn cứ chính. trich_dan_khac: các đoạn khác cũng chấp nhận làm căn cứ. Tất cả là chuỗi con nguyên văn.
#   - bay: tên các bẫy trong ca. ly_giai: vì sao gán nhãn này. diem_mo_ho: chua_co_ma = chưa có mục trong docs/06.
#   - Vế N2 (M-09: A1 chỉ trích, engine luôn hạ) chỉ gán nhãn ở ca chắc chắn chua_thay.

