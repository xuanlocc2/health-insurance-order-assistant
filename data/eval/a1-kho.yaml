- id: KHO-12
  ten: "PCT — anh trai mất vì nhiễm trùng huyết, ông suy thận suy tim, mẹ lo"
  muc_dich: "'Nhiễm trùng huyết' xuất hiện 2 lần, 'nhiễm trùng máu' 1 lần, suy 2 cơ quan — không cái nào của trẻ."
  benh_nhan: { tuoi_thang: 30 }
  icd: [R50.9]
  sinh_hieu: { nhiet_do: null, mach: 120, nhip_tho: 28 }
  phieu_kham: "Anh trai mất năm ngoái vì nhiễm trùng huyết do não mô cầu. Ông nội đang lọc máu vì suy thận, suy tim. Mẹ rất lo, hỏi con có bị nhiễm trùng máu không. Bé sốt 1 ngày, sáng nay mẹ đo ở nhà 38,5. Khám: tỉnh, chơi, da hồng, không ban xuất huyết, chi ấm, CRT < 2s, tiểu được. Họng, phổi bình thường. Đã giải thích hiện chưa có dấu hiệu nhiễm trùng huyết."
  chi_dinh: [{ ma: "23.0130.1549", ten: "Định lượng Procalcitonin" }]
  ky_vong:
    - ma: "23.0130.1549"
      ve:
