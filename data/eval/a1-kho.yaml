- id: KHO-11
  ten: "Ba người nhà bệnh, trẻ có ran thật"
  muc_dich: "Đối chứng dương của nhóm người nhà: căn cứ phải là ran của trẻ, không phải viêm phổi của bố hay AFB (+) của bà."
