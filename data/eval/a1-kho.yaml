  phieu_kham: "Bố mới ra viện vì viêm phổi, bà nội đang điều trị lao phổi AFB (+). Chị gái viêm họng. Bé ho 1 tuần, sốt về chiều 3 ngày nay, ăn kém. Khám: họng hồng, amidan không mủ, tai sạch. Phổi: ran ẩm vừa hạt rải rác 2 đáy, không rít. Hạch cổ không to."
  chi_dinh: [{ ma: "23.0228.1483", ten: "Định lượng CRP" }]
