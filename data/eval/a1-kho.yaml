  muc_dich: "Dịch tễ không phải dấu hiệu của trẻ. Ngược lại, số điều dưỡng đo tại lần khám này là số hợp lệ — không được bỏ."
  benh_nhan: { tuoi_thang: 40 }
  icd: [R50.9]
  sinh_hieu: { nhiet_do: null, mach: null, nhip_tho: null }
  phieu_kham: "Cả lớp mầm non có 6 bạn nghỉ vì cúm A, cô giáo báo 2 bạn viêm phổi phải nhập viện. Bạn cùng nhà trọ bị tay chân miệng tuần trước. Bé sốt từ đêm qua, chưa ho, chưa chảy mũi. Điều dưỡng đo lúc tiếp đón: T 38,4; M 120; NT 30. Khám: họng chưa thấy đỏ, miệng không loét, lòng bàn tay bàn chân không phỏng nước, phổi không ran. Mẹ xin xét nghiệm vì sợ lây."
  chi_dinh: [{ ma: "23.0228.1483", ten: "Định lượng CRP" }]
