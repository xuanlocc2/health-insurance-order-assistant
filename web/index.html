<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chỉ định dịch vụ · Trợ lý BHYT</title>
<link rel="icon" href="data:,">
<style>
/* ===== THEME: bố cục và màu theo màn "Chỉ định dịch vụ" của EForm ===== */
:root{
  --font: Arial, "Segoe UI", Helvetica, sans-serif;
  --font-mono: Consolas, monospace;
  --fs: 12.5px; --fs-sm: 11.5px;
  --w: 1100px;              /* bề rộng nội dung */
  --text: #333; --muted: #777; --line: #ddd; --soft: #f5f5f5;
  --blue: #2f78c4;          /* thanh tiêu đề, tab đang chọn */
  --blue-d: #2a5f96;        /* dải nút dưới cùng */
  --blue-m: #3a7dc0;        /* dải "Tổng số" */
  --link: #2a6db5;
  --corner: #f5b400;
  --yellow: #f7c600;        /* nút Kiểm tra BHYT / Xác nhận chỉ định */
  --cyan: #18b4e8;          /* nút Thêm chỉ định */
  --box-line: #f5c58a;      /* viền khung danh sách bên trái trang 2 */
  --top: #e4f4f1;           /* dải xanh nhạt dưới header */
  /* 4 trạng thái: chữ / nền */
  --ok: #1e7e34; --ok-bg: #e3f4e7;  /* Phù hợp quy tắc BHYT */
  --cc: #1d5fc4; --cc-bg: #e6effc;  /* Đủ căn cứ · bác sĩ xác nhận */
  --rv: #b35c00; --rv-bg: #fdf0d9;  /* Cần xem lại */
  --no: #d0021b; --no-bg: #fde6e4;  /* Không được chi trả */
  --hl: #fff1a8; --tag: #6941c6; --tag-bg: #f3eeff;
}
/* ===== hết THEME ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--text);font:var(--fs)/1.45 var(--font);background:linear-gradient(var(--top),#fff 260px) no-repeat;background-color:#fff;padding-bottom:110px}
select,button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],select,textarea{border:1px solid #ccc;border-radius:2px;padding:5px 8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#66afe9;box-shadow:0 0 0 2px rgba(102,175,233,.25)}
input[type=checkbox]{width:15px;height:15px;margin:0;vertical-align:middle;accent-color:var(--blue)}
input[type=number]{-moz-appearance:textfield} input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
a,.lk{color:var(--link);cursor:pointer;text-decoration:none;background:none;border:0;padding:0}
a:hover,.lk:hover{text-decoration:underline}
.wrap{max-width:var(--w);margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.corner{position:relative}
.corner::before{content:"";position:absolute;left:-1px;top:-1px;border-style:solid;border-width:9px 9px 0 0;border-color:var(--corner) transparent transparent transparent}
/* Header */
header{background:#fff;border-bottom:1px solid #eee}
header .wrap{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.hctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-sm)}
.hctl select{max-width:440px;padding:3px 6px}
.tkhoan{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.tkhoan b{color:var(--blue-d)}
.tkhoan button{border:1px solid #ccc;border-radius:2px;background:#fff;padding:3px 9px;font-size:var(--fs-sm);cursor:pointer}
/* buổi đo Before/After */
body.dang-do .hctl,body.dang-do .x,body.dang-do [data-xnthem],body.dang-do #icdin{display:none}
body.dang-do #view :disabled{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text);background:#fafafa}
.dobar{display:flex;gap:4px 12px;flex-wrap:wrap;margin:6px 0;padding:7px 10px;border-radius:2px;font-size:var(--fs);background:var(--cc-bg);color:var(--cc)}
.dobar.tu_tra{background:var(--tag-bg);color:var(--tag)}
.doman{max-width:520px;margin:56px auto;padding:28px 24px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:4px;text-align:center}
.doman h1{margin:0 0 4px;font-size:22px;font-weight:600;color:var(--blue-d)}
.doman .cd{display:inline-block;margin:6px 0 12px;padding:3px 12px;border-radius:999px;font-weight:700;background:var(--cc-bg);color:var(--cc)}
.doman .cd.tu_tra{background:var(--tag-bg);color:var(--tag)}
.doman p{margin:0 0 16px;line-height:1.5}
.doman .bd{min-width:200px;padding:10px 22px;border:1px solid #e0b000;border-radius:2px;background:var(--yellow);font-size:14px;font-weight:700;cursor:pointer}
.doman .phu{display:block;margin:14px auto 0;border:0;background:none;color:var(--link);font-size:var(--fs-sm);text-decoration:underline;cursor:pointer}
.tu-tra h4{margin:10px 0 2px}
.tu-tra .dv{display:flex;gap:8px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid #eee;font-size:var(--fs);cursor:pointer}
.seg{display:inline-flex;border:1px solid #ccc;border-radius:2px}
.seg button{border:0;background:#fff;padding:3px 9px;font-size:var(--fs-sm)}
.seg button.on{background:var(--blue);color:#fff}
.crumb{color:var(--muted);font-size:var(--fs-sm);margin:8px 0 4px}
/* PID + phiếu khám (Mở rộng) */
.pid{background:#fff;border:1px solid var(--line);padding:5px 8px 5px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.pid .lk{text-decoration:underline;font-size:var(--fs-sm);white-space:nowrap}
.mr{border:1px solid var(--line);border-top:0;background:#fff;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mr h4{margin:0 0 6px;font-size:12px;color:var(--blue)}
.mr .full{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.kv input{width:100%;font-weight:400;padding:2px 6px}
.pk{width:100%;border:1px solid var(--line);background:#fafafa;padding:8px 10px;min-height:56px;white-space:pre-wrap;line-height:1.7;resize:vertical}
mark{background:var(--hl);color:inherit;padding:0 2px}
@media (max-width:760px){.mr{grid-template-columns:1fr}}
/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--blue);margin:14px 0 10px}
.tabs button{border:1px solid var(--line);border-bottom:0;background:#fff;padding:7px 12px;font-weight:700;border-radius:3px 3px 0 0}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* Khung chung */
.box{background:#fff;border:1px solid var(--line);padding:10px 12px;margin-bottom:10px}
.box h4{margin:0 0 6px;font-size:14px;font-weight:400;color:#222}
.fl{display:block;font-weight:700;margin-bottom:4px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px;align-items:start}
.cols2{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px;align-items:start}
@media (max-width:820px){.cols,.cols2{grid-template-columns:1fr}}
/* Trang 1: nhóm dịch vụ */
.sec{border:1px solid var(--line);background:#fff;margin-bottom:6px}
.sech{padding:6px 10px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:center}
.sech .ic{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;background:#f0f0f0;font-size:10px}
.sech.on{background:var(--blue);color:#fff} .sech.on .ic{background:rgba(255,255,255,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px;padding:10px}
.opt{display:flex;gap:7px;align-items:flex-start;cursor:pointer;font-size:var(--fs-sm)}
.opt input{width:20px;height:20px;flex:none}
.opt .ma{display:block}
.it{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid #eee;color:var(--link);font-size:var(--fs-sm)}
.x{border:0;background:none;padding:0 2px;font-size:11px;color:#222;cursor:pointer;flex:none}
/* Trang 2: cột trái */
.alert{border:1px solid var(--box-line);background:#fff8e6;color:var(--no);padding:8px 10px;margin-bottom:10px;display:flex;gap:8px;font-size:var(--fs-sm)}
.alert::before{content:"⚠";color:var(--no);font-size:16px;line-height:1}
.box.o{border-color:var(--box-line)}
.it2{display:grid;grid-template-columns:auto 1fr auto;gap:6px;padding:5px 0;border-bottom:1px solid #eee;font-size:var(--fs-sm)}
.it2 input{margin-top:2px}
.st{font-style:italic}
.t-ok{color:var(--ok)} .t-cc{color:var(--cc)} .t-rv{color:var(--rv)} .t-no{color:var(--no)}
/* Trang 2: cột phải (form chỉ định) */
.frm{background:#fff;border:1px solid var(--line);padding:6px}
.bar1{background:var(--blue);color:#fff;font-weight:700;padding:6px 8px;margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-sm)}
.bar1:first-child{margin-top:0}
.bar1 .lk{color:#fff;text-decoration:underline}
.bar1r{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.row{display:grid;grid-template-columns:150px 1fr;border:1px solid var(--line);border-top:0}
.row>label,.row>.lb{background:var(--soft);padding:8px;text-align:right;font-weight:700;font-size:var(--fs-sm);border-right:1px solid var(--line)}
.row>div{padding:6px 8px;min-width:0}
.row i{color:var(--no);font-style:normal}
.grp{margin-top:8px}
.grph{background:var(--blue);color:#fff;padding:6px 8px;font-weight:700;font-size:var(--fs-sm)}
.grpb{border:1px solid var(--line);border-top:0;padding:6px}
.fr{margin-bottom:6px}
.frh{background:var(--blue);color:#fff;font-weight:700;padding:6px 8px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:var(--fs-sm)}
.frh .t{flex:1;min-width:0}
.frh .car{font-size:10px}
.frb{border:1px solid var(--line);border-top:0}
.frb .row{border:0;border-bottom:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-cc{color:var(--cc);background:var(--cc-bg)}
.s-rv{color:var(--rv);background:var(--rv-bg)} .s-no{color:var(--no);background:var(--no-bg)} .s-na{color:var(--muted);background:#eee}
.chip{display:inline-flex;gap:4px;align-items:center;background:#eef4fb;border:1px solid #cfe0f3;border-radius:2px;padding:1px 6px;margin:0 4px 4px 0;font-size:var(--fs-sm)}
.chip b{font-family:var(--font-mono)}
.why{padding:6px 8px 10px}
.why summary{cursor:pointer;color:var(--link);font-weight:700;font-size:var(--fs-sm)}
.why h5{margin:10px 0 4px;font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
blockquote{margin:0 0 6px;padding:6px 10px;border-left:3px solid var(--blue);background:#f7f9fc}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:2px}
table{width:100%;border-collapse:collapse}
th{background:var(--soft);text-align:left;padding:5px 8px;font-size:var(--fs-sm);border-bottom:1px solid var(--line)}
td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top;font-size:var(--fs-sm)}
.r-dat{color:var(--ok);font-weight:700} .r-chua_thay{color:var(--rv);font-weight:700} .r-chua_du{color:var(--muted);font-weight:700} .r-khong_dat{color:var(--no);font-weight:700}
.src{font-family:var(--font-mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line);background:var(--soft)}
.warn{color:var(--rv);font-size:var(--fs-sm);padding:6px 8px;background:#fffaf0;border:1px solid #f3dcb0;margin-top:6px}
.err{color:var(--no)}
.gd{color:var(--tag);font-weight:700;padding:0 2px;margin-left:2px}
/* Lịch sử chỉ định */
.ls h3{margin:0 0 8px;font-size:15px}
.vs{border:1px solid var(--line);margin-bottom:10px}
.vsh{padding:7px 26px 7px 8px;cursor:pointer;position:relative;font-size:var(--fs-sm)}
.vsh .ic{position:absolute;right:8px;top:7px;font-size:10px}
.vs.on>.vsh{background:var(--blue);color:#fff}
.vsb{padding:8px}
.sub{background:var(--soft);border:1px solid var(--line);padding:6px 8px;font-size:var(--fs-sm)}
.vsb .in{padding:8px 10px;border:1px solid var(--line);border-top:0}
.vsb h4{margin:0 0 4px;font-size:13px}
.vsb input[readonly]{width:100%;margin:4px 0 8px;background:#fff}
.g td{color:var(--link);font-weight:700;background:#fff}
.placed{color:var(--link)}
.ok-msg{background:var(--ok-bg);color:var(--ok);padding:6px 10px;margin-bottom:8px;font-size:var(--fs-sm)}
/* Dải dưới cùng */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:8}
.tot{background:var(--blue-m);color:#fff}
.tot .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;font-size:15px}
.tot .errt{font-size:var(--fs-sm);background:#fff;color:var(--no);padding:2px 8px}
.btns{background:var(--blue-d)}
.btns .wrap{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.btns button{border:1px solid #ccc;border-radius:2px;padding:5px 14px;background:#fff}
.btns .back{margin-right:auto}
.btns button:disabled{opacity:1;background:#7f9cbb!important;border-color:#7f9cbb!important;color:#e8eef5}
.tot .xem{color:#fff;text-decoration:underline;font-size:var(--fs);font-weight:700}
.b-c{background:var(--cyan)!important;border-color:var(--cyan)!important;color:#fff}
.b-y{background:var(--yellow)!important;border-color:#e0b000!important;min-width:220px;font-weight:700}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
/* Gợi ý tìm kiếm, bảng Giả định, hộp tạo ca */
.sugg{position:fixed;z-index:20;background:#fff;border:1px solid #ccc;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:340px;overflow:auto;padding:2px}
.sugg div{display:flex;gap:10px;padding:5px 8px;cursor:pointer}
.sugg div.on{background:#e8f1fb}
.sugg .ma{flex:none;min-width:90px;font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:1px}
.gdp{position:fixed;z-index:30;width:min(460px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #ccc;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;font-size:var(--fs-sm)}
.gdp .gdh{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.gdi{padding:6px 0;border-top:1px solid #eee} .gdi.hl{background:var(--tag-bg);margin:0 -12px;padding:6px 12px}
.gdi b{color:var(--tag)}
.close{border:1px solid #ccc;background:#fff;width:24px;height:24px;padding:0}
dialog#moi{border:1px solid #ccc;padding:18px;width:min(420px,calc(100vw - 32px))}
dialog#moi::backdrop{background:rgba(0,0,0,.35)}
dialog#moi h2{margin:0 0 10px;font-size:15px} dialog#moi input{width:100%;margin:4px 0 8px}
.dlg-btn{display:flex;justify-content:flex-end;gap:12px;margin-top:12px}
.dlg-btn button{border:1px solid #ccc;background:#fff;padding:5px 14px}
/* Trang Phiếu khám ngoại trú */
.pkt{text-align:center;font-size:24px;font-weight:400;color:#444;margin:8px 0 2px}
.pkn{text-align:center;color:var(--muted);font-size:var(--fs-sm);margin-bottom:10px}
.cbdl{margin:0 0 10px;padding:7px 10px;border:1px solid #f0d9ad;border-radius:2px;background:var(--rv-bg);color:var(--rv);font-size:var(--fs);text-align:center}
.pgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 14px;padding:10px 8px}
.pf{display:flex;flex-direction:column;gap:3px;min-width:0}
.pf>label,.pfl{font-weight:700;font-size:var(--fs-sm)}
.pf small{font-weight:400;color:var(--muted)}
.pf input{width:100%;border:1px solid #ccc;border-radius:2px;padding:5px 8px;background:#fff}
.pfw{padding:8px 8px 2px}
.pfw textarea{width:100%;display:block;min-height:58px;resize:vertical;line-height:1.5}
.pfd{grid-column:span 2}
input.sai,.pf input.sai{border-color:var(--no);background:var(--no-bg)}
.xnt{overflow-x:auto}
.xnt table{min-width:520px}
.xnt input{width:90px;padding:3px 6px}
.xnt .lk{margin-top:6px}
@media (max-width:420px){.pfd{grid-column:auto}}
/* Ô tìm dịch vụ có nút mũi tên sổ danh sách */
.tk{position:relative}
.tk input{width:100%;padding-right:40px}
.tkm{position:absolute;top:1px;right:1px;bottom:1px;width:36px;border:0;border-left:1px solid #ddd;border-radius:0 2px 2px 0;background:#f5f5f5;color:#444;font-size:14px;line-height:1}
.tkm:hover{background:#e8f1fb;color:var(--blue)}
.sugg .kq0{cursor:default;color:var(--muted);padding:8px}
/* Popup: dịch vụ đã có trong danh sách */
.tbao{position:fixed;z-index:40;top:64px;left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 32px));background:#fffaf0;border:1px solid #f3dcb0;border-left:4px solid var(--rv);box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 40px 10px 12px;color:var(--text)}
.tbao b{display:block;color:var(--rv);margin-bottom:2px}
.tbao .close{position:absolute;top:8px;right:8px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hctl" title="Điều khiển demo (không có trên EForm thật)">
    <span class="seg" id="mode"><button data-m="1">Bác sĩ tự nhập</button><button data-m="0">Ca có sẵn</button></span>
    <select id="ca" aria-label="Ca mẫu"></select>
  </div>
  <div class="tkhoan"><button type="button" id="vaodo" hidden>Vào buổi đo</button><b id="tk"></b><button type="button" id="dxuat">Đăng xuất</button></div>
</div></header>
<div class="doman" id="doman" hidden></div>
<div class="wrap" id="app">
  <div class="crumb">Chỉ định dịch vụ</div>
  <div class="dobar" id="dobar" hidden></div>
  <div id="pid"></div>
  <div class="tabs" role="tablist"><button data-tab="pk">Phiếu khám</button><button data-tab="cd">Chỉ định</button><button data-tab="ls">Lịch sử chỉ định</button></div>
  <div id="view"></div>
</div>
<div class="foot" id="bar"></div>
<div class="sugg" id="sugg" role="listbox" hidden></div>
<dialog id="moi" aria-label="Tạo ca mới"><form method="dialog">
  <h2>Tạo ca mới</h2>
  <label for="moiten">Tên ca</label>
  <input type="text" id="moiten" required pattern=".*\S.*" maxlength="200" autocomplete="off" placeholder="vd Viêm phổi 3 tuổi, có CRP">
  <div class="muted">Ca được lưu lại và tự lưu mỗi lần sửa.</div>
  <div class="dlg-btn"><button value="huy" formnovalidate>Hủy</button><button value="ok">Tạo ca</button></div>
</form></dialog>
<div class="gdp" id="gdp" role="dialog" aria-label="Giả định" hidden></div>
<div class="tbao" id="tbao" role="alert" hidden></div>
<script>
const S = {"Phù hợp quy tắc BHYT":"ok","Đủ căn cứ · bác sĩ xác nhận":"cc","Cần xem lại":"rv","Không được chi trả":"no"};
const nhan = r => r.ma_ly_do==="danh_muc" ? "Có trong danh mục BHYT" : r.trang_thai;
const stOf = r => S[r.trang_thai] || "rv"; // trạng thái lạ → Cần xem lại, không bao giờ "Phù hợp"
const LYDO = {nguoi_nha_yeu_cau:"Người nhà yêu cầu → tự túc", loai_tru_theo_doi:"Loại trừ, theo dõi nghi ngờ", khong_dong_y:"Không đồng ý kết quả kiểm tra", khac:"Khác"};
const KQ = {dat:"đạt",chua_thay:"chưa thấy",chua_du:"chưa đủ dữ liệu",chua_du_du_lieu:"chưa đủ dữ liệu",khong_dat:"chưa đạt"};

// qs: các đoạn AI trích. Trả full = cả phiếu, tô từng câu chứa đoạn trích; sents = các câu đó, đoạn trích in đậm.
function highlight(text,qs){
  const cau=[]; // [a,b,at,len]
  for(const q of [].concat(qs||[]).filter(Boolean)){
    const at=text.indexOf(q); if(at<0) continue;
    // ranh giới câu: . ! ? (trừ dấu thập phân "38.5") hoặc xuống dòng; length-1: đoạn trích tự kết thúc bằng dấu chấm thì câu dừng ở đó
    const re=/[.!?](?!\d)|\n/g; let a=0,b=text.length,m;
    while((m=re.exec(text))){ if(m.index<at) a=m.index+1; else if(m.index>=at+q.length-1){ b=m.index+(m[0]==="\n"?0:1); break; } }
    while(a<at&&/\s/.test(text[a])) a++;
    cau.push([a,b,at,q.length]);
  }
  cau.sort((x,y)=>x[0]-y[0]);
  let full="",k=0;
  for(const [a,b] of cau){ if(a<k) { if(b>k){full+="<mark>"+esc(text.slice(k,b))+"</mark>";k=b} continue }
    full+=esc(text.slice(k,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; k=b }
  full+=esc(text.slice(k));
  const sents=[...new Set(cau.map(([a,b,at,n])=>esc(text.slice(a,at)).trimStart()+"<b>"+esc(text.slice(at,at+n))+"</b>"+esc(text.slice(at+n,b)).trimEnd()))];
  return {full,sents};
}
const post=async(url,body,method="POST",keepalive=false)=>{
  const r=await fetch(url,{method,keepalive,headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===401){ location.href="/dang-nhap"; throw new Error("Phiên đăng nhập đã hết hạn.") }
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(typeof j.detail==="string"?j.detail:"Lỗi "+r.status);
  return j;
};

// Trang 1: tìm và tích dịch vụ (không làm gói chỉ định)

// dòng đang mở: bác sĩ đã bấm thì theo bác sĩ, chưa bấm thì mở dòng không xanh (Cần xem lại, Không được chi trả)
const moOf=(d,r)=>d.open??(stOf(r)!=="ok");
// nút ở thanh "2. Thông tin chỉ định dịch vụ": còn dòng nào đang mở thì thu gọn hết, không còn thì mở hết
function nutGon(){
  const co=cds.map((d,i)=>[d,res&&res.dong[i]]).filter(([,r])=>r);
  if(!co.length) return "";
  const dangMo=co.some(([d,r])=>moOf(d,r));
  return `<button class="lk" data-gon="${dangMo?0:1}">${dangMo?"Thu gọn tất cả ▴":"Mở tất cả ▾"}</button>`;
}
// Trang 2: cột trái tích BHYT, cột phải từng khung chỉ định giải thích lý do

  const d=cds[i], r=res&&res.dong[i], ma=(r&&r.ma)||d.ma||"— chưa có mã";
  if(!r) return `<div class="fr" id="fr-${i}"><div class="frh"><span class="t">${esc(ma)} - ${esc(d.ten)}</span><span class="badge s-na">${dang?"Đang kiểm tra…":"Chưa kiểm tra"}</span></div></div>`;
  const k=stOf(r), mo=moOf(d,r), chon=chonOf(i), g=gy(r), cl=r.checklist||[], h=highlight(sent.phieu_kham,trichOf(r));
  const goiY=g==="tich"?"Hệ thống tích sẵn":g==="trong"?"Hệ thống để trống":"Bác sĩ tự chọn";
  const doi=g!=null&&chon!==(g==="tich");
  return `<div class="fr" id="fr-${i}"><div class="frh" data-fr="${i}"><span class="t">${esc(ma)} - ${esc(r.ten||d.ten)}</span><span class="badge s-${k}">${esc(nhan(r))}</span><span class="car">${mo?"▴":"▾"}</span></div>${mo?`
    <div class="frb">
      <div class="row"><div class="lb">Kết quả kiểm tra BHYT</div><div>${lyDoHtml(r.ly_do)}</div></div>
      <div class="row"><label for="cb-${i}">Dịch vụ đủ điều kiện thanh toán BHYT</label><div><input type="checkbox" id="cb-${i}" data-cb="${i}" ${chon?"checked":""}> <span class="muted">${goiY}${doi?" · bác sĩ đã đổi":""}</span></div></div>
      <div class="row"><label for="ly-${i}">Lý do</label><div><select id="ly-${i}" data-ly="${i}"><option value="">Không bắt buộc</option>${
        Object.entries(LYDO).map(([v,l])=>`<option value="${v}" ${d.ly&&d.ly.loai===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
      <div class="row"><label for="note-${i}">Ghi chú</label><div><input type="text" id="note-${i}" data-note="${i}" placeholder="Nhập (vd vì sao không đồng ý kết quả kiểm tra)" value="${esc((d.ly&&d.ly.ghi_chu)||"")}" style="width:100%"></div></div>
      <details class="why" data-ct="${i}" ${d.ct?"open":""}><summary>Vì sao? Căn cứ quy định và kiểm tra từng điều kiện</summary>
        <h5>Căn cứ (nguyên văn quy định)</h5>${(r.can_cu||[]).length?r.can_cu.map(x=>{const y=canCu(x);return `<blockquote>${y.t?"“"+esc(y.t)+"”":""}<cite>${esc(y.v)}</cite></blockquote>`}).join(""):'<div class="muted">Không có điều kiện riêng cho dịch vụ này.</div>'}
        ${cl.length?`<h5>Kiểm tra từng điều kiện</h5><table><thead><tr><th>Điều kiện</th><th>Kết quả</th><th>Ai kiểm tra</th><th>Bằng chứng</th></tr></thead><tbody>${
          cl.map(v=>`<tr><td>${esc(v.mo_ta)}${sao((v.diem_mo_ho||[]).length?v.diem_mo_ho:null)}</td>
           <td class="r-${esc(v.ket_qua==="chua_du_du_lieu"?"chua_du":v.ket_qua)}">${KQ[v.ket_qua]||esc(v.ket_qua)}</td><td>${NGUON[v.nguon_ket_qua]?`<span class="src">${NGUON[v.nguon_ket_qua]}</span>`:"—"}</td><td>${bangChung(v)}</td></tr>`).join("")}</tbody></table>`:""}
        ${h.sents.length?`<h5>Đoạn phiếu khám liên quan điều kiện BHYT</h5><blockquote>${h.sents.join("<br>")}<cite>AI trích nguyên văn từ phiếu khám; chữ đậm là phần AI dẫn làm bằng chứng. Mở rộng thanh PID để xem cả phiếu.</cite></blockquote>`:""}
      </details>
    </div>`:""}</div>`;
}

// Lượt tự tra của buổi đo: chỉ có danh sách để bác sĩ tự tích, không có gợi ý nào của công cụ

  return `<div class="box tu-tra"><div class="alert">Tích chọn các dịch vụ đủ điều kiện thanh toán BHYT</div>
    <div>Chẩn đoán: ${icd.map(x=>`<span class="chip"><b>${esc(x)}</b>${icdTen[x]?" "+esc(icdTen[x]):""}</span>`).join("")||'<span class="muted">(chưa có)</span>'}</div>
    ${theoNhom().map(([h,ds])=>`<h4>${h}</h4>${ds.map(([d,i])=>`<label class="dv"><input type="checkbox" data-tt="${i}" ${d.chon?"checked":""}><span>${mt(d.ma,d.ten)}</span></label>`).join("")}`).join("")}</div>`;

const nutDo=()=>`<button class="back" data-tab="pk">‹ Phiếu khám</button>${laTuTra()?"":`<button id="chk" ${doc?"disabled":""}>${doc?'<span class="spin"></span>AI đang đọc phiếu khám…':"Kiểm tra BHYT"}</button>`}
  <button class="b-y" id="luudo" ${(!laTuTra()&&(!res||!daDocDo))||doc||dangXN?"disabled":""}>Xác nhận và lưu</button>`;
// màn giữa các ca: bác sĩ bấm "Bắt đầu ca" thì mới bấm giờ, ca chưa bắt đầu chưa hiện nội dung
function manDo(d){ DO=d; const c=d.hien_tai, m=$("doman"), tt=c&&c.che_do==="tu_tra";
  document.body.classList.add("dang-do"); $("app").hidden=true; $("bar").hidden=true; m.hidden=false; scrollTo(0,0);
  m.innerHTML=c?`<h1>Ca đo ${c.thu_tu}/${d.tong}</h1><div class="cd ${esc(c.che_do)}">${tt?"Tự tra":"Dùng công cụ"}</div>
    <p>${tt?"Bác sĩ tra cứu theo cách quen dùng hằng ngày, không dùng công cụ AI, rồi tích các dịch vụ đủ điều kiện BHYT.":"Bác sĩ bấm Kiểm tra BHYT để xem gợi ý của công cụ, rồi tự quyết định tích dịch vụ nào."} Sau khi bấm “Xác nhận và lưu”, ca sẽ được khóa.</p>
    <button class="bd" data-dobd>Bắt đầu ca</button>${c.thu_tu===1?'<button class="phu" data-dobo>Để sau, dùng thử tự do</button>':""}`
    :`<h1>Đã hoàn thành buổi đo</h1><p>Bác sĩ đã làm xong ${d.da_xong}/${d.tong} ca. Cảm ơn bác sĩ đã tham gia.</p><button class="bd" data-dobo>Dùng thử tự do</button>`; }
function moCaDo(c){ $("doman").hidden=true; $("app").hidden=false; $("bar").hidden=false; cases=[{...c,do_luong:true}]; ca=c.id; res=null; daDocDo=false; load(); }
function thoatDo(){ document.body.classList.remove("dang-do"); $("doman").hidden=true; $("app").hidden=false; $("bar").hidden=false;
  $("vaodo").hidden=!DO.hien_tai; cases=caThuong; ca=cases[0].id; dsCa(); load(); }
async function luuDo(){ const c=cur(); if(dangXN||doc||(!laTuTra()&&(!res||!daDocDo))) return;
  const dong=laTuTra()?cds.map(d=>({ma:d.ma,ten:d.ten,bac_si_chon:d.chon?"tich":"khong_tich"}))
    :res.dong.map((r,i)=>({ma:r.ma||cds[i].ma,ten:cds[i].ten,bac_si_chon:chonOf(i)?"tich":"khong_tich",trang_thai:r.trang_thai,o_bhyt_goi_y:gy(r)}));
  dangXN=true; veBar(); let j;
  try{ j=await post("/do-luong/"+c.id,{kiem_tra_id:res?res.kiem_tra_id:null,dong}) }
  catch(e){ dangXN=false; setErr("Không lưu được: "+e.message); return }
  dangXN=false; manDo(j); }

// Tab Lịch sử chỉ định: lượt đã xác nhận trong phiên + lịch sử dịch vụ đã dùng của ca (lich_su)
function lichSu(c){
  const ten=ma=>(dm.find(e=>e.ma===ma)||{}).ten;
  const coNgay=(c.lich_su||[]).filter(x=>x.ngay_cach!=null);
  const past=[...new Set(coNgay.map(x=>x.ngay_cach))].sort((a,b)=>a-b).map(nc=>({id:"ls"+nc, ngay:fmtNgay(c.ngay_kham,nc), lk:`${nc} ngày trước`,
    items:coNgay.filter(x=>x.ngay_cach===nc).map(x=>({ma:x.ma,ten:x.ten||ten(x.ma)||x.ma,tt:"Đã có kết quả",
      kq:x.ket_qua!=null?`Kết quả: ${x.ket_qua}${x.don_vi?" "+x.don_vi:""}${x.tham_chieu_tren!=null?` (ngưỡng trên ${x.tham_chieu_tren})`:""}`:""}))}));
  const vs=[...daXN.filter(v=>v.ca===c.id).reverse(),...past];
  const visit=v=>{ const mo=lsMo.has(v.id);
    return `<div class="vs ${mo?"on":""} corner"><div class="vsh" data-ls="${v.id}"><b>(${v.gio?v.gio+" ":""}${esc(v.ngay)} - ${esc(v.lk)})</b> Phòng khám Nhi - bs.nhi<span class="ic">${mo?"▴":"▾"}</span></div>${mo?`
      <div class="vsb"><div class="sub">${v.gio?v.gio+" ":""}${esc(v.ngay)} - bs.nhi</div><div class="in">
        <h4>Danh sách đã chỉ định</h4><b>Chẩn đoán/ Lịch sử lâm sàng</b>
        <input type="text" readonly value="${esc(v.icd&&v.icd.length?v.icd.map(x=>icdTen[x]?`${icdTen[x]} (${x})`:x).join("; "):"—")}">
        <table><thead><tr><th></th><th>BHYT</th><th>Trạng thái</th><th>Ngày chỉ định</th></tr></thead><tbody>${
          NHOM.map(([k,,h])=>{ const ds=v.items.filter(d=>nhomOf(d)===k); return ds.length?`<tr class="g"><td colspan="4">${h}</td></tr>`+ds.map(d=>`<tr>
            <td><span class="placed">${mt(d.ma,d.ten)}</span>${d.kq?`<div class="muted">${esc(d.kq)}</div>`:""}</td>
            <td>${d.bhyt==null?"—":d.bhyt?"BHYT":"Tự túc"}${d.tt2?`<div class="muted">${esc(d.tt2)}</div>`:""}</td><td class="placed">${esc(d.tt)}</td><td>${v.gio?v.gio+" ":""}${esc(v.ngay)}</td></tr>`).join(""):"" }).join("")}</tbody></table>
      </div></div>`:""}</div>`; };
  return `<div class="box ls"><h3>Lịch sử bệnh nhân</h3>${okMsg?`<div class="ok-msg">${esc(okMsg)}</div>`:""}${vs.map(visit).join("")||'<div class="muted">Chưa có lịch sử chỉ định.</div>'}</div>`;
}

function nhacXem(){ // dòng Cần xem lại / Không được chi trả: bấm để lần lượt nhảy tới từng dòng
  const ds=res.dong.map((r,i)=>[stOf(r),i]).filter(([k])=>k==="rv"||k==="no"); if(!ds.length) return "";
  const rv=ds.filter(([k])=>k==="rv").length, no=ds.length-rv, ke=(ds.find(([,i])=>i>(sel??-1))||ds[0])[1];
  return `<button class="lk xem" data-go="${ke}">Xem ${[rv?rv+" dòng Cần xem lại":"",no?no+" dòng Không được chi trả":""].filter(Boolean).join(", ")}</button>`; }

function veBar(){
  const n=cds.length, k=laTuTra()?cds.filter(d=>d.chon).length:res?cds.filter((_,i)=>chonOf(i)).length:0;
  const spin='<span class="spin"></span>', xong=!!res&&res.kiem_tra_id===daGhi, laPk=tab==="pk", thieu=xnThieu(cur());

// nhập trên trang Phiếu khám: chỉ cập nhật dữ liệu, rời trang mới chạy lại quy tắc
function soO(t){ const raw=t.value.trim().replace(",","."), v=raw===""?null:Number(raw), ok=v===null||(Number.isFinite(v)&&v>=0);
  ok?oLoi.delete(t.id):oLoi.set(t.id,t.value); t.classList.toggle("sai",!ok); t.setAttribute("aria-invalid",!ok); return ok?v:null; }

  else if(d.xn!=null) c.lich_su[+d.xn][d.xk]=soO(t);

  else if(d.pf==="muc_huong"){ const v=soO(t); if(bn.the) bn.the.muc_huong=v }
  else if(d.pf==="tuoi_thang"||d.pf==="tuoi_ngay"){ // chỉ giữ một cách ghi tuổi: engine ưu tiên tuổi theo ngày nên số cũ không được sót lại
    const v=soO(t), kia=d.pf==="tuoi_thang"?"tuoi_ngay":"tuoi_thang"; bn[d.pf]=v;

// xếp hạng gợi ý: trùng hẳn > bắt đầu bằng > mọi từ khớp đầu từ > chứa chuỗi > chứa đủ các từ; hòa thì tên ngắn trước
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase().trim();
const keys=e=>[...(e.ma?[[norm(e.ma),1],[norm(e.ma).replace(".",""),1]]:[]),[norm(e.ten),0],...(e.bi_danh||[]).map(b=>[norm(b),0])];
function score(ks,q,qt){ let best=0;
  for(const [t,laMa] of ks){
    let s=t===q?100:t.startsWith(q)?80:0;
    if(!s){ const w=t.split(/[^a-z0-9.]+/);
      s=qt.every(x=>w.some(y=>y.startsWith(x)))?60:t.includes(q)?40:qt.every(x=>t.includes(x))?20:0; }
    if(s) best=Math.max(best,s+laMa*5);
  } return best; }
const abc=new Map(); // chưa gõ gì → danh sách theo thứ tự abc (ICD theo mã, dịch vụ theo tên), sắp một lần
const macDinh=(list,by)=>{ if(abc.get(list)?.n!==list.length)
  abc.set(list,{n:list.length,v:[...list].sort((a,b)=>String(a[by]||"").localeCompare(String(b[by]||""),"vi"))}); return abc.get(list).v; };
function rank(list,q,by){ q=norm(q); if(!q) return macDinh(list,by); const qt=q.split(/\s+/);
  return list.map(e=>[score(e._k||(e._k=keys(e)),q,qt),e]).filter(x=>x[0])
    .sort((a,b)=>b[0]-a[0]||a[1].ten.length-b[1].ten.length).slice(0,12).map(x=>x[1]); }

const SUG={icdin:()=>[icdList,"ma"], cdin:()=>[dm,"ten"]}; let sg={id:null,items:[],k:0}, chanSg=false;
// tatCa: bỏ qua chữ đang gõ, hiện toàn bộ danh sách (nút mũi tên khi chữ đang gõ không khớp dòng nào)
function showSugg(inp,tatCa=false){ const b=$("sugg"), [list,by]=SUG[inp.id](), q=tatCa?"":inp.value; sg={id:inp.id,items:rank(list,q,by),k:q.trim()?0:-1}; // ô trống: chưa chọn sẵn dòng nào
  if(!sg.items.length&&!q.trim()){b.hidden=true;return} // danh mục chưa tải xong
  const r=inp.getBoundingClientRect(), w=Math.min(Math.max(r.width,380),innerWidth-16);
  Object.assign(b.style,{left:Math.max(8,Math.min(r.left,innerWidth-w-8))+"px",width:w+"px"});
  b.innerHTML=""; sg.shown=0;
  if(sg.items.length) more(60); else b.innerHTML=`<div class="kq0">${inp.id==="cdin"?"Không tìm thấy dịch vụ phù hợp. Bấm mũi tên để xem toàn bộ danh sách.":"Không tìm thấy mã ICD phù hợp."}</div>`;
  // ô nằm sát mép dưới màn hình thì mở danh sách lên trên, để không bị khuất
  const duoi=innerHeight-r.bottom-12, tren=r.top-12, lenTren=duoi<180&&tren>duoi;
  b.style.maxHeight=Math.min(340,lenTren?tren:duoi)+"px"; b.scrollTop=0; b.hidden=false;
  b.style.top=(lenTren?r.top-4-b.offsetHeight:r.bottom+4)+"px"; }
// vẽ dần từng đợt: danh sách mặc định có tới ~15.000 mã, vẽ hết một lúc sẽ giật
function more(upto){ const b=$("sugg"), to=Math.min(sg.items.length,Math.max(upto,sg.shown+60));
  b.insertAdjacentHTML("beforeend",sg.items.slice(sg.shown,to).map((e,j)=>`<div role="option" data-k="${sg.shown+j}" class="${sg.shown+j===sg.k?"on":""}"><span class="ma">${esc(e.ma||"—")}</span><span>${esc(e.ten)}</span></div>`).join("")); sg.shown=to; }
$("sugg").addEventListener("scroll",e=>{ const b=e.target; if(sg.shown<sg.items.length&&b.scrollTop+b.clientHeight>b.scrollHeight-120) more(sg.shown+60) });
const hideSugg=()=>{$("sugg").hidden=true};
function pick(inp,e){ hideSugg(); inp.id==="icdin"?addIcd(e?e.ma:inp.value):addCd(inp.value,e); }
document.addEventListener("input",e=>{ if(SUG[e.target.id]) showSugg(e.target) });
document.addEventListener("keydown",e=>{ const inp=e.target; if(!SUG[inp.id]) return;
  const open=!$("sugg").hidden&&sg.id===inp.id, n=sg.items.length;
  if(!open&&e.key==="ArrowDown"){ e.preventDefault(); showSugg(inp); return }
  if(open&&n&&(e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); const dn=e.key==="ArrowDown"; sg.k=Math.max(0,Math.min(n-1,sg.k+(dn?1:-1))); if(sg.k>=sg.shown) more(sg.k+1);
    [...$("sugg").children].forEach((d,i)=>d.classList.toggle("on",i===sg.k)); $("sugg").children[sg.k].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); pick(inp,open&&sg.k>=0?sg.items[sg.k]:null); }
  else if(e.key==="Escape") hideSugg(); });
// rê chuột: dòng dưới con trỏ sáng lên (dùng chung chỉ số với phím mũi tên), bấm là chọn

  if(t.closest("#luudo")){ luuDo(); return }
  if(on("data-xca")&&confirm("Xóa ca tự tạo này? Không khôi phục được.")){ const id=ca, giu=choLuu; clearTimeout(hen); choLuu=null;
    hangLuu.then(()=>post("/cases/"+id,undefined,"DELETE")).then(()=>{ cases=cases.filter(x=>x.id!==id); ca=cases[0].id; dsCa(); load() })
      .catch(e=>{ if(giu) giu(); setErr("Không xóa được ca: "+e.message) }); } // xóa hỏng: vẫn lưu phần vừa sửa
});
document.addEventListener("change",e=>{ const t=e.target, ds=t.dataset;
  if(ds.tt!=null){ cds[+ds.tt].chon=t.checked; veBar() }
  else if(ds.dm!=null){ const en=dm[+ds.dm]; cds=cds.some(x=>khop(x,en))?cds.filter(x=>!khop(x,en)):[...cds,{ma:en.ma,ten:en.ten}]; check(false); } // bỏ tích: bỏ mọi dòng của dịch vụ đó
  else if(ds.cb!=null){ cds[+ds.cb].chon=t.checked; daGhi=null; render() } // đổi lựa chọn sau khi xác nhận thì được xác nhận lại
  else if(ds.ly!=null){ lyOf(+ds.ly).loai=t.value||null; daGhi=null; render() }
  else if(ds.note!=null&&daGhi){ daGhi=null; render() }
  else if(ds.pf==="ten"){ if(!t.value.trim()) t.value=cur().ten; dsCa() } // không cho để trống tên
  else if(ds.pf==="ngay_kham"&&!t.value) t.value=cur().ngay_kham; // ngày khám luôn phải có
});
document.addEventListener("input",e=>{ const t=e.target;
  if(t.dataset.note!=null) lyOf(+t.dataset.note).ghi_chu=t.value||null;
  else if(t.dataset.po||t.dataset.pf||t.dataset.xn!=null) nhapPK(t); });
document.addEventListener("toggle",e=>{ const i=e.target.dataset&&e.target.dataset.ct; if(i!=null&&cds[+i]) cds[+i].ct=e.target.open },true); // nhớ mục "Vì sao?" đang mở qua các lần vẽ lại
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("gdp").hidden) $("gdp").hidden=true });
// bảng Giả định: nút ở thanh "2. Thông tin chỉ định dịch vụ" hoặc dấu * (ở lý do hay từng điều kiện)
document.addEventListener("click",e=>{ const p=$("gdp"), t=e.target;
  const b=t.closest("[data-gd]"); if(b){ e.stopPropagation(); const hl=b.dataset.gd?b.dataset.gd.split(","):[];
    if(!p.hidden&&p._btn===b){p.hidden=true;return} openGd(b,hl); return }
  if(t.dataset.gdt){ gdTab=t.dataset.gdt; openGd(p._btn,(p.dataset.hl||"").split(",").filter(Boolean)); return }
  if(t.closest("[data-gdx]")||!t.closest("#gdp")) p.hidden=true; },true);

fetch("/toi").then(r=>r.json()).then(j=>{$("tk").textContent=j.tai_khoan||""}).catch(()=>{});
$("dxuat").addEventListener("click",()=>hangLuu.catch(()=>{}).then(()=>fetch("/dang-xuat",{method:"POST"})).finally(()=>{location.href="/dang-nhap"}));
fetch("/gia-dinh").then(r=>r.json()).then(j=>{GD=j}).catch(()=>{});
fetch("/danh-muc").then(r=>r.json()).then(j=>{dm=j; pkPhien++; if(cases.length) render()}).catch(()=>{}); // không có danh mục vẫn gõ tự do được
fetch("/icd").then(r=>r.json()).then(j=>{icdList=j; icdTen={}; j.forEach(e=>{const m=e.ma.replace(/[*+]$/,""); if(!icdTen[m]) icdTen[m]=e.ten}); pkPhien++; if(cases.length) render()}).catch(()=>{});
$("doman").addEventListener("click",e=>{ if(e.target.closest("[data-dobd]")) moCaDo(DO.hien_tai); else if(e.target.closest("[data-dobo]")) thoatDo() });
$("vaodo").addEventListener("click",()=>location.reload());
Promise.all([fetch("/cases").then(r=>r.json()),fetch("/do-luong").then(r=>r.json()).catch(()=>null)]).then(([j,d])=>{
  caThuong=cases=j; ca=cases[0].id; dsCa(); if(d&&d.hien_tai) manDo(d); else load();
}).catch(e=>{$("view").innerHTML='<div class="box err">Không tải được danh sách ca: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
