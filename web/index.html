<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trợ lý BHYT</title>
<style>
/* ===== THEME: sửa ở đây để đổi giao diện (chỉ giao diện sáng) ===== */
:root{
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
  --fs: 13.5px;  --fs-sm: 12px;  --fs-xs: 11px;
  --radius: 12px; --radius-sm: 8px;
  --gap: 16px;
  --drawer-w: 500px;
  /* Nền & chữ */
  --bg: #f3f5f9;           /* nền trang */
  --card: #ffffff;         /* nền thẻ */
  --line: #e4e7ee;         /* viền */
  --line-soft: #eef0f4;    /* kẻ dòng bảng */
  --head: #f8f9fc;         /* nền tiêu đề bảng */
  --text: #1b2232;
  --muted: #667085;
  --accent: #0e7c86;       /* màu nhận diện (teal) */
  --accent-soft: #e3f3f4;
  --sel: #f0f8f9;          /* dòng đang chọn */
  --goiy: #5b5bd6;         /* viền ô ghi lý do */
  /* 4 trạng thái: chữ / nền */
  --ok: #157f3c;  --ok-bg: #e5f6ea;   /* Phù hợp quy tắc BHYT */
  --cc: #1d5fc4;  --cc-bg: #e6effc;   /* Đủ căn cứ · bác sĩ xác nhận */
  --rv: #a15c00;  --rv-bg: #fdf1dc;   /* Cần xem lại */
  --no: #c2261b;  --no-bg: #fde8e6;   /* Không được chi trả */
  --tint-cc: #f5f9ff;      /* tô dòng đủ căn cứ */
  --hl: #fff1a8;           /* tô trích dẫn A1 trong phiếu khám */
  --tag: #6941c6; --tag-bg: #f3eeff;  /* nhãn cách hiểu tạm M-xx */
  --shadow: 0 1px 2px rgba(16,24,40,.05);
  --shadow-lg: -12px 0 32px rgba(16,24,40,.14);
}
/* ===== hết THEME ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased}
select,button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--head);border-color:#d0d5dd}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 20px}
button.primary:hover{filter:brightness(1.07)}
button.link{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px;font-size:var(--fs-sm)}
button.link:hover{text-decoration:underline;background:none}
select,input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0;vertical-align:middle}
/* Thanh trên */
.appbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:var(--fs-sm)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:var(--fs-sm)}
.seg{display:inline-flex;background:var(--head);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 12px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
/* Giả định: dấu * trong lý do + bảng tổng hợp */
.gd{color:var(--tag);font-weight:700;padding:0 2px;margin-left:2px}
.gdp{position:fixed;z-index:30;width:min(460px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(16,24,40,.18);padding:12px 14px;font-size:var(--fs-sm)}
.gdp .gdh{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.gdi{padding:8px 0;border-top:1px solid var(--line)} .gdi.hl{background:var(--tag-bg);margin:0 -14px;padding:8px 14px}
.gdi b{color:var(--tag)}
main{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(280px,1fr) 2.2fr;gap:var(--gap);padding:12px 20px 24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}.appbar{padding:10px 16px}}
main>section{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
/* Thẻ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h2{margin:0;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-h h2{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vitals div{background:var(--head);border-radius:var(--radius-sm);padding:8px 10px}
.vitals small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.vitals b{font-size:18px} .vitals span{color:var(--muted);font-size:var(--fs-xs);margin-left:2px}
.chip{display:inline-block;font-family:var(--font-mono);font-size:var(--fs-sm);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
.pk{width:100%;box-sizing:border-box;resize:vertical;font:inherit;color:var(--text);border:1px solid var(--line);background:var(--head);border-radius:var(--radius-sm);padding:10px 12px;min-height:60px;white-space:pre-wrap;line-height:1.7}
mark{background:var(--hl);color:inherit;padding:1px 2px;border-radius:3px}
/* Bảng */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--head);border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td{border-bottom:1px solid var(--line-soft);padding:10px 12px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--head)}
tr.tint td{background:var(--tint-cc)}
tr.sel td{background:var(--sel)} tr.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
td.cb{width:84px;white-space:nowrap}
.ten{font-weight:600}
.ma{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:var(--fs-sm);font-weight:600;padding:3px 10px;border-radius:999px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-cc{color:var(--cc);background:var(--cc-bg)}
.s-rv{color:var(--rv);background:var(--rv-bg)} .s-no{color:var(--no);background:var(--no-bg)}
.lydo{color:var(--muted);font-size:var(--fs-sm)}
.picker{margin-top:8px;padding:8px 10px;background:#fafaff;border:1px dashed var(--goiy);border-radius:var(--radius-sm);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;cursor:default;color:var(--text)}
.picker label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
/* Gợi ý tìm kiếm ICD / dịch vụ */
.sugg{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(16,24,40,.14);max-height:340px;overflow:auto;padding:4px}
.sugg div{display:flex;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer}
.sugg div.on{background:var(--sel)}
.sugg .ma{flex:none;min-width:84px;padding-top:2px}
.chip small{font-family:var(--font);color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
pre{font:11.5px/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-all;margin:0;max-height:340px;overflow:auto;background:#0f172a;color:#e2e8f0;border-radius:var(--radius-sm);padding:12px}
.muted{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--no);font-size:var(--fs-sm);margin-top:8px}
.warn{color:var(--rv);font-size:var(--fs-sm);margin-bottom:8px}
/* Ngăn kéo "Vì sao?" */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(15,23,42,.28);backdrop-filter:blur(1px);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;z-index:10;top:0;right:0;height:100%;width:min(var(--drawer-w),100vw);background:var(--card);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
body.open .scrim{opacity:1;pointer-events:auto} body.open .drawer{transform:none}
.dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh small{display:block;color:var(--muted);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dh b{font-size:16px}
.close{width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.drawer .body{padding:16px 20px 28px}
.drawer h3{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
blockquote{margin:0 0 8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--head);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-size:var(--fs-xs);margin-top:4px}
.r-dat{color:var(--ok);font-weight:600} .r-chua_thay{color:var(--rv);font-weight:600} .r-chua_du{color:var(--muted);font-weight:600} .r-khong_dat{color:var(--no);font-weight:600}
.src{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--head);border:1px solid var(--line)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:var(--fs-sm);margin-top:12px}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="logo">B</span><div><b>Phiếu chỉ định cận lâm sàng</b><small>Khám Nhi · Trợ lý BHYT</small></div></div>
  <div class="ctl"><span class="seg" id="mode"><button data-m="1">Bác sĩ tự nhập</button><button data-m="0">Ca có sẵn</button></span>
    <label>Ca mẫu <select id="ca"></select></label></div>
</header>
<main>
  <section id="left"></section>
  <section>
    <div class="card">
      <div class="card-h"><h2>Danh sách chỉ định · BHYT</h2><span><span class="muted" id="sum"></span> <button class="link" id="gdbtn" data-gd="">Giả định</button></span></div>
      <div class="warn" id="a1warn" role="status" hidden></div>
      <div class="tbl"><table><thead><tr><th>Tính BHYT</th><th>Dịch vụ</th><th>Trạng thái</th><th>Lý do</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="foot"><span class="muted" id="tip"></span><span><button class="primary" id="chk">Kiểm tra BHYT</button> <button class="primary" id="ok" hidden>Xác nhận</button></span></div>
    </div>
    <div class="card" id="log" hidden><div class="card-h"><h2>Đã xác nhận</h2></div><div id="logtxt"></div></div>
  </section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="sugg" id="sugg" role="listbox" hidden></div>
<div class="gdp" id="gdp" role="dialog" aria-label="Giả định" hidden></div>
<script>
const S = {"Phù hợp quy tắc BHYT":"ok","Đủ căn cứ · bác sĩ xác nhận":"cc","Cần xem lại":"rv","Không được chi trả":"no"};
const nhan = r => r.ma_ly_do==="danh_muc" ? "Có trong danh mục BHYT" : r.trang_thai;
const stOf = r => S[r.trang_thai] || "rv"; // trạng thái lạ → Cần xem lại, không bao giờ "Phù hợp"
const LYDO = {nguoi_nha_yeu_cau:"Người nhà yêu cầu → tự túc", loai_tru_theo_doi:"Loại trừ, theo dõi nghi ngờ", khong_dong_y:"Không đồng ý kết quả kiểm tra", khac:"Khác"};
const KQ = {dat:"đạt",chua_thay:"chưa thấy",chua_du:"chưa đủ dữ liệu",chua_du_du_lieu:"chưa đủ dữ liệu",khong_dat:"chưa đạt"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let cases=[], ca=null, sel=null;
let res=null, sent=null, seq=0, dang=false;          // res = kết quả /check khớp với cds hiện tại (null khi đang chạy lại)
let tu=true, icd=[], cds=[], dm=[], pk="", nhap=null; // pk = phiếu khám đã xác nhận; nhap = bản đang chỉnh sửa (null = không sửa)                 // tu = bác sĩ tự nhập; cds[i] = {ma, ten, chon?, ly?, mo?}: chon = bác sĩ đã tự đổi ô BHYT
let icdList=[], icdTen={};                           // danh mục ICD-10 (TT 06/2026) cho ô tìm chẩn đoán
const cur = () => cases.find(c=>c.id===ca);
// ô BHYT gợi ý: ưu tiên o_bhyt_goi_y của engine (spec §8), dự phòng theo trạng thái
const gy = r => r.o_bhyt_goi_y !== undefined ? r.o_bhyt_goi_y : ({ok:"tich",cc:"tich",rv:null,no:"trong"})[stOf(r)];
const chonOf = i => cds[i].chon ?? gy(res.dong[i])==="tich";
const lyOf = i => cds[i].ly ??= {loai:null,ghi_chu:null};
const trichOf = r => (r.checklist||[]).flatMap(v=>[v.trich_dan,...(v.trich_them||[])]).filter(Boolean); // mọi đoạn AI dẫn làm căn cứ
const NGUON = {nhap:"Dữ liệu nhập", a1:"AI đọc phiếu"};
// cột Bằng chứng: vế AI đọc thì hiện nguyên văn câu AI trích, không chỉ "AI đọc phiếu khám"
const bangChung = v => v.trich_dan ? [v.trich_dan,...(v.trich_them||[])].map(t=>`“${esc(t)}”`).join("<br>")
  : (v.trich_lien_quan||[]).length ? `${ai(v.bang_chung)}<div class="muted">Có nhắc nhưng chưa đủ: ${v.trich_lien_quan.map(t=>`“${esc(t)}”`).join(", ")}</div>`
  : ai(v.bang_chung);
const ai = s => esc(s).replace(/A1/g,"AI");          // chữ nội bộ "A1" trong câu của engine → "AI" cho bác sĩ
// Giả định: engine nối hậu tố "(cách hiểu tạm M-xx, chưa được bác sĩ duyệt)" vào lý do (log giữ nguyên).
// Màn hình bỏ hậu tố, thay bằng dấu * bấm được → bảng "Giả định" (nguồn: docs/06 qua /gia-dinh).
const GD_RE=/\s*\(cách hiểu tạm([^)]*), chưa được bác sĩ duyệt\)/g;
function lyDo(s){ s=String(s||""); const m=[...s.matchAll(GD_RE)]; return {t:s.replace(GD_RE,""), ma:m.length?[...new Set(m.flatMap(x=>x[1].match(/M-\d+/g)||[]))]:null}; }
const sao = ma => ma ? `<button class="link gd" data-gd="${esc(ma.join(","))}" title="Dựa trên cách hiểu tạm${ma.length?" "+esc(ma.join(", ")):""}, chưa được bác sĩ duyệt. Bấm để xem.">*</button>` : "";
const lyDoHtml = s => { const l=lyDo(s); return ai(l.t)+sao(l.ma); };
let GD=[], gdTab="dung";
const gdDung = () => [...new Set((res&&res.dong||[]).flatMap(r=>[...(lyDo(r.ly_do).ma||[]),...(r.checklist||[]).flatMap(v=>v.diem_mo_ho||[])]))];
function openGd(btn,hl){
  const p=$("gdp"), dung=gdDung(), ds=gdTab==="dung"?GD.filter(g=>dung.includes(g.ma)):GD;
  p.innerHTML=`<div class="gdh"><b>Giả định</b><span class="seg"><button data-gdt="dung" class="${gdTab==="dung"?"on":""}">Đang dùng (${dung.length})</button><button data-gdt="all" class="${gdTab==="all"?"on":""}">Tất cả (${GD.length})</button></span><button class="close" data-gdx aria-label="Đóng">×</button></div>
    <div class="muted" style="margin-bottom:6px">Chỗ quy định chưa rõ, đang áp dụng cách hiểu tạm, chờ bác sĩ duyệt. Dấu <span class="gd">*</span> = kết luận dựa trên giả định.</div>
    ${ds.map(g=>`<div class="gdi ${hl.includes(g.ma)?"hl":""}"><b>${esc(g.ma)}</b> ${esc(g.cau_hoi)}<div><span class="muted">Cách hiểu tạm:</span> ${esc(g.cach_hieu)}</div>${g.tra_loi?`<div><span class="muted">Ghi chú:</span> ${esc(g.tra_loi)}</div>`:""}</div>`).join("")||'<div class="muted">Lượt khám này chưa dùng giả định nào.</div>'}`;
  p.hidden=false; p.dataset.hl=hl.join(",");
  const r=btn.getBoundingClientRect(), w=p.offsetWidth;
  Object.assign(p.style,{left:Math.max(8,Math.min(r.right-w,innerWidth-w-8))+"px",top:Math.min(r.bottom+6,innerHeight-p.offsetHeight-8)+"px"});
  p._btn=btn; const h=p.querySelector(".hl"); if(h) h.scrollIntoView({block:"nearest"});
}
// qs: các đoạn AI trích. Trả full = cả phiếu, tô từng câu chứa đoạn trích; sents = các câu đó, đoạn trích in đậm.
function highlight(text,qs){
  const cau=[]; // [a,b,at,len]
  for(const q of [].concat(qs||[]).filter(Boolean)){
    const at=text.indexOf(q); if(at<0) continue;
    // ranh giới câu: . ! ? (trừ dấu thập phân "38.5") hoặc xuống dòng; length-1: đoạn trích tự kết thúc bằng dấu chấm thì câu dừng ở đó
    const re=/[.!?](?!\d)|\n/g; let a=0,b=text.length,m;
    while((m=re.exec(text))){ if(m.index<at) a=m.index+1; else if(m.index>=at+q.length-1){ b=m.index+(m[0]==="\n"?0:1); break; } }
    while(a<at&&/\s/.test(text[a])) a++;
    cau.push([a,b,at,q.length]);
  }
  cau.sort((x,y)=>x[0]-y[0]);
  let full="",k=0;
  for(const [a,b] of cau){ if(a<k) { if(b>k){full+="<mark>"+esc(text.slice(k,b))+"</mark>";k=b} continue }
    full+=esc(text.slice(k,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; k=b }
  full+=esc(text.slice(k));
  const sents=[...new Set(cau.map(([a,b,at,n])=>esc(text.slice(a,at)).trimStart()+"<b>"+esc(text.slice(at,at+n))+"</b>"+esc(text.slice(at+n,b)).trimEnd()))];
  return {full,sents};
}
const post=async(url,body)=>{
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(typeof j.detail==="string"?j.detail:"Lỗi "+r.status);
  return j;
};
function setErr(t){ let e=$("err"); if(!e){e=document.createElement("div");e.id="err";e.className="err";$("tip").parentNode.after(e)} e.textContent=t }

function addCd(v,e){ v=v.trim(); if(!v&&!e) return;
  cds.push(e?{ma:e.ma,ten:e.ten}:{ma:null,ten:v}); $("cdin").value=""; check(false); $("cdin").focus(); }
function addIcd(v){ v=v.trim().toUpperCase().replace(/\s+/g,"").replace(/[*+]$/,""); // mã ghi * hoặc + trong danh mục: hồ sơ/XML chỉ dùng phần mã
  if(!/^[A-Z]\d{2}(\.\d{1,2})?$/.test(v)) return; // không phải mã, không có gợi ý → giữ nguyên chữ đang gõ
  $("icdin").value=""; if(!icd.includes(v)){icd.push(v); check(false)} $("icdin").focus(); }

// xếp hạng gợi ý: trùng hẳn > bắt đầu bằng > mọi từ khớp đầu từ > chứa chuỗi > chứa đủ các từ; hòa thì tên ngắn trước
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase().trim();
const keys=e=>[...(e.ma?[[norm(e.ma),1],[norm(e.ma).replace(".",""),1]]:[]),[norm(e.ten),0],...(e.bi_danh||[]).map(b=>[norm(b),0])];
function score(ks,q,qt){ let best=0;
  for(const [t,laMa] of ks){
    let s=t===q?100:t.startsWith(q)?80:0;
    if(!s){ const w=t.split(/[^a-z0-9.]+/);
      s=qt.every(x=>w.some(y=>y.startsWith(x)))?60:t.includes(q)?40:qt.every(x=>t.includes(x))?20:0; }
    if(s) best=Math.max(best,s+laMa*5);

const macDinh=(list,by)=>{ if(abc.get(list)?.n!==list.length)
  abc.set(list,{n:list.length,v:[...list].sort((a,b)=>String(a[by]||"").localeCompare(String(b[by]||""),"vi"))}); return abc.get(list).v; };
function rank(list,q,by){ q=norm(q); if(!q) return macDinh(list,by); const qt=q.split(/\s+/);

  const b=t.closest("[data-gd]"); if(b){ e.stopPropagation(); const hl=b.dataset.gd?b.dataset.gd.split(","):[];
    if(!p.hidden&&p._btn===b){p.hidden=true;return} openGd(b,hl); return }
  if(t.dataset.gdt){ gdTab=t.dataset.gdt; openGd(p._btn,(p.dataset.hl||"").split(",").filter(Boolean)); return }
  if(t.closest("[data-gdx]")||!t.closest("#gdp")) p.hidden=true; },true);

fetch("/gia-dinh").then(r=>r.json()).then(j=>{GD=j}).catch(()=>{});
fetch("/danh-muc").then(r=>r.json()).then(j=>{dm=j}).catch(()=>{}); // không có gợi ý vẫn gõ tự do được
fetch("/icd").then(r=>r.json()).then(j=>{icdList=j; icdTen={}; j.forEach(e=>{const m=e.ma.replace(/[*+]$/,""); if(!icdTen[m]) icdTen[m]=e.ten}); if(cases.length) render()}).catch(()=>{});
fetch("/cases").then(r=>r.json()).then(j=>{
  cases=j; $("ca").innerHTML=cases.map(c=>`<option value="${esc(c.id)}">${esc(c.id)} · ${esc(c.ten)}</option>`).join("");
  ca=cases[0].id; load();
}).catch(e=>{$("left").innerHTML='<div class="card err">Không tải được danh sách ca: '+esc(e.message)+'</div>'});
</script>
