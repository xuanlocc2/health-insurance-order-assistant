<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trợ lý BHYT</title>
<style>
/* ===== THEME: sửa ở đây để đổi giao diện (chỉ giao diện sáng) ===== */
:root{
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, monospace;
  --fs: 13.5px;  --fs-sm: 12px;  --fs-xs: 11px;
  --radius: 12px; --radius-sm: 8px;
  --gap: 16px;
  --drawer-w: 500px;
  /* Nền & chữ */
  --bg: #f3f5f9;           /* nền trang */
  --card: #ffffff;         /* nền thẻ */
  --line: #e4e7ee;         /* viền */
  --line-soft: #eef0f4;    /* kẻ dòng bảng */
  --head: #f8f9fc;         /* nền tiêu đề bảng */
  --text: #1b2232;
  --muted: #667085;
  --accent: #0e7c86;       /* màu nhận diện (teal) */
  --accent-soft: #e3f3f4;
  --sel: #f0f8f9;          /* dòng đang chọn */
  --goiy: #5b5bd6;         /* nhãn "gợi ý" cạnh ô đã tích sẵn */
  /* 4 trạng thái: chữ / nền */
  --ok: #157f3c;  --ok-bg: #e5f6ea;   /* Phù hợp quy tắc BHYT */
  --cc: #1d5fc4;  --cc-bg: #e6effc;   /* Cần xem lại · đủ căn cứ */
  --rv: #a15c00;  --rv-bg: #fdf1dc;   /* Cần xem lại */
  --no: #c2261b;  --no-bg: #fde8e6;   /* Không được chi trả */
  --tint-cc: #f5f9ff;      /* tô dòng đủ căn cứ */
  --hl: #fff1a8;           /* tô trích dẫn A1 trong phiếu khám */
  --tag: #6941c6; --tag-bg: #f3eeff;  /* nhãn cách hiểu tạm M-xx */
  --shadow: 0 1px 2px rgba(16,24,40,.05);
  --shadow-lg: -12px 0 32px rgba(16,24,40,.14);
}
/* ===== hết THEME ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 var(--font);-webkit-font-smoothing:antialiased}
select,button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--head);border-color:#d0d5dd}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:8px 20px}
button.primary:hover{filter:brightness(1.07)}
button.link{border:0;background:none;color:var(--accent);font-weight:600;padding:2px 4px;font-size:var(--fs-sm)}
button.link:hover{text-decoration:underline;background:none}
select,input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 10px;outline:none}
select:focus,input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0;vertical-align:middle}
/* Thanh trên */
.appbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}
.brand small{color:var(--muted);font-size:var(--fs-sm)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:var(--fs-sm)}
.seg{display:inline-flex;background:var(--head);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 12px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.12)}
.hint{max-width:1440px;margin:12px auto 0;padding:0 20px;color:var(--muted);font-size:var(--fs-sm)}
main{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(280px,1fr) 2.2fr;gap:var(--gap);padding:12px 20px 24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}.appbar{padding:10px 16px}}
main>section{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
/* Thẻ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h2{margin:0;font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-h h2{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.vitals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vitals div{background:var(--head);border-radius:var(--radius-sm);padding:8px 10px}
.vitals small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.vitals b{font-size:18px} .vitals span{color:var(--muted);font-size:var(--fs-xs);margin-left:2px}
.chip{display:inline-block;font-family:var(--font-mono);font-size:var(--fs-sm);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0}
.pk{background:var(--head);border-radius:var(--radius-sm);padding:10px 12px;min-height:60px;white-space:pre-wrap;line-height:1.7}
mark{background:var(--hl);color:inherit;padding:1px 2px;border-radius:3px}
/* Bảng */
.tbl{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--head);border-bottom:1px solid var(--line);padding:8px 12px;text-align:left;font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td{border-bottom:1px solid var(--line-soft);padding:10px 12px;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--head)}
tr.tint td{background:var(--tint-cc)}
tr.sel td{background:var(--sel)} tr.sel td:first-child{box-shadow:inset 3px 0 var(--accent)}
td.cb{width:84px;white-space:nowrap}
.ten{font-weight:600}
.ma{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--muted)}
.goiy{font-size:10px;color:var(--goiy);background:#f0f0ff;border:1px dashed var(--goiy);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:var(--fs-sm);font-weight:600;padding:3px 10px;border-radius:999px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:var(--ok-bg)} .s-cc{color:var(--cc);background:var(--cc-bg)}
.s-rv{color:var(--rv);background:var(--rv-bg)} .s-no{color:var(--no);background:var(--no-bg)}
.lydo{color:var(--muted);font-size:var(--fs-sm)}
.hs{display:block;width:fit-content;margin-top:4px;font-size:11px;font-weight:600;padding:1px 6px;color:var(--rv);background:var(--rv-bg);border-radius:4px}
.hs i{font-style:normal;font-weight:400}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;color:var(--tag);background:var(--tag-bg);border-radius:4px;margin-left:6px}
.picker{margin-top:8px;padding:8px 10px;background:#fafaff;border:1px dashed var(--goiy);border-radius:var(--radius-sm);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;cursor:default;color:var(--text)}
.picker label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
/* Gợi ý tìm kiếm ICD / dịch vụ */
.sugg{position:fixed;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 8px 24px rgba(16,24,40,.14);max-height:340px;overflow:auto;padding:4px}
.sugg div{display:flex;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer}
.sugg div.on{background:var(--sel)}
.sugg .ma{flex:none;min-width:84px;padding-top:2px}
.chip small{font-family:var(--font);color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
pre{font:11.5px/1.6 var(--font-mono);white-space:pre-wrap;word-break:break-all;margin:0;max-height:340px;overflow:auto;background:#0f172a;color:#e2e8f0;border-radius:var(--radius-sm);padding:12px}
.muted{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--no);font-size:var(--fs-sm);margin-top:8px}
.warn{color:var(--rv);font-size:var(--fs-sm);margin-bottom:8px}
/* Ngăn kéo "Vì sao?" */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(15,23,42,.28);backdrop-filter:blur(1px);opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;z-index:10;top:0;right:0;height:100%;width:min(var(--drawer-w),100vw);background:var(--card);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
body.open .scrim{opacity:1;pointer-events:auto} body.open .drawer{transform:none}
.dh{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh small{display:block;color:var(--muted);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.dh b{font-size:16px}
.close{width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;line-height:1}
.drawer .body{padding:16px 20px 28px}
.drawer h3{font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
blockquote{margin:0 0 8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--head);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-size:var(--fs-xs);margin-top:4px}
.r-dat{color:var(--ok);font-weight:600} .r-chua_thay{color:var(--rv);font-weight:600} .r-chua_du{color:var(--muted);font-weight:600} .r-khong_dat{color:var(--no);font-weight:600}
.src{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--head);border:1px solid var(--line)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:var(--fs-sm);margin-top:12px}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="logo">B</span><div><b>Phiếu chỉ định cận lâm sàng</b><small>Khám Nhi · Trợ lý BHYT</small></div></div>
  <div class="ctl"><span class="seg" id="mode"><button data-m="1">Bác sĩ tự nhập</button><button data-m="0">Ca có sẵn</button></span>
    <label>Ca <select id="ca"></select></label>
    <span class="seg" id="lan"><button data-l="1">Lần tích 1</button><button data-l="2">Lần 2</button></span></div>
</header>
<div class="hint">Ô BHYT chỉ là gợi ý (nhãn <span class="goiy">gợi ý</span>) — bác sĩ quyết định.</div>
<main>
  <section id="left"></section>
  <section>
    <div class="card">
      <div class="card-h"><h2>Danh sách chỉ định · BHYT</h2><span class="muted" id="sum"></span></div>
      <div class="warn" id="a1warn" role="status" hidden></div>
      <div class="warn" id="nhac" role="status" hidden></div>
      <div class="tbl"><table><thead><tr><th>BHYT</th><th>Dịch vụ</th><th>Trạng thái</th><th>Lý do</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="foot"><span class="muted" id="tip"></span><span><button id="edit" hidden>Sửa chỉ định</button> <button class="primary" id="chk">Kiểm tra BHYT</button> <button class="primary" id="ok" hidden>Xác nhận</button></span></div>
    </div>
    <div class="card" id="log" hidden><div class="card-h"><h2>Sẽ ghi thêm vào logs/xac-nhan.jsonl</h2></div><div class="warn" id="miss"></div><pre id="logtxt"></pre></div>
  </section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="sugg" id="sugg" role="listbox" hidden></div>
<script>
const S = {"Phù hợp quy tắc BHYT":"ok","Cần xem lại · đủ căn cứ":"cc","Cần xem lại":"rv","Không được chi trả":"no"};
const nhan = r => r.ma_ly_do==="danh_muc" ? "Có trong danh mục BHYT" : r.trang_thai;
const stOf = r => S[r.trang_thai] || "rv"; // trạng thái lạ → Cần xem lại, không bao giờ "Phù hợp"
const LYDO = {nguoi_nha_yeu_cau:"Người nhà yêu cầu → tự túc", loai_tru_theo_doi:"Loại trừ, theo dõi nghi ngờ", khac:"Khác"};
const KQ = {dat:"đạt",chua_thay:"chưa thấy",chua_du:"chưa đủ dữ liệu",chua_du_du_lieu:"chưa đủ dữ liệu",khong_dat:"chưa đạt"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let cases=[], ca=null, lan=1, sel=null, tick=[];   // tick[i]: chỉ định i được đưa vào kiểm tra
let res=null, st=[], sent=null;                      // res = kết quả /check; st[i] = {chon, ly}; sent = lượt đã gửi
let tu=true, icd=[], cds=[], dm=[];                 // tu = bác sĩ tự nhập; icd/cds = chẩn đoán, chỉ định đang soạn; dm = danh mục gợi ý
let icdList=[], icdTen={};                           // danh mục ICD-10 (TT 06/2026) cho ô tìm chẩn đoán
const lanCases = k => cases.filter(c=>c.luot_kham===k);
const cur = () => lanCases(ca).find(c=>c.lan_tich===lan) || lanCases(ca)[0];
// lưu ý hồ sơ: gợi ý AI tách khỏi quy tắc BHYT, không đổi trạng thái hay ô gợi ý
const HS='Hồ sơ chưa nêu lý do chỉ định <i>· gợi ý AI, không phải quy tắc BHYT</i>';
const hs = r => r.luu_y_ho_so && r.luu_y_ho_so.ket_qua==="chua_thay_ly_do" ? `<span class="hs">${HS}</span>` : "";
// ô BHYT gợi ý: ưu tiên o_bhyt_goi_y của engine (spec §8), dự phòng theo trạng thái
const gy = r => r.o_bhyt_goi_y !== undefined ? r.o_bhyt_goi_y : ({ok:"tich",cc:"tich",rv:null,no:"trong"})[stOf(r)];
const needReason=(r,s)=>(gy(r)==="tich"&&!s.chon)||(r.trang_thai==="Không được chi trả"&&s.chon); // F-12, khớp _ly_do của server
const trichOf = r => ((r.checklist||[]).find(v=>v.trich_dan)||{}).trich_dan || null;

function highlight(text,q){
  const at=q?text.indexOf(q):-1; if(at<0) return {full:esc(text),sent:null};
  // ranh giới câu: . ! ? (trừ dấu thập phân "38.5") hoặc xuống dòng (phiếu ghi theo dòng)
  const re=/[.!?](?!\d)|\n/g; let a=0,b=text.length,m;
  while((m=re.exec(text))){ if(m.index<at) a=m.index+1; else if(m.index>=at+q.length){ b=m.index+(m[0]==="\n"?0:1); break; } }
  while(a<at&&/\s/.test(text[a])) a++;
  const s=text.slice(a,b);
  return {full:esc(text.slice(0,a))+"<mark>"+esc(s)+"</mark>"+esc(text.slice(b)),
          sent:esc(s.trim()).replace(esc(q),()=>`<b>${esc(q)}</b>`)};
}
const post=async(url,body)=>{
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(typeof j.detail==="string"?j.detail:"Lỗi "+r.status);
  return j;
};
function setErr(t){ let e=$("err"); if(!e){e=document.createElement("div");e.id="err";e.className="err";$("tip").parentNode.after(e)} e.textContent=t }

function load(){ const c=cur(); icd=tu?[]:[...(c.icd||[])]; cds=tu?[]:c.chi_dinh.map(x=>({...x}));
  tick=cds.map(()=>true); res=null; st=[]; sel=null; closeDrawer();
  $("log").hidden=true; setErr(""); render(); }

function leftCards(c,pk){
  const bn=c.benh_nhan, the=bn.the, t=bn.tuoi_thang, sh=c.sinh_hieu||{};
  const tuoi = t!=null ? `${t} tháng (${(t/12).toFixed(t%12?1:0)} tuổi)` : (bn.tuoi_ngay!=null?bn.tuoi_ngay+" ngày":"—");
  const conHan = the && the.han_den >= (c.ngay_kham||""), sua = tu && !res;
  return `
   <div class="card"><div class="card-h"><h2>Bệnh nhân</h2><span class="ma">${esc(c.luot_kham)}</span></div><dl class="kv">
     <dt>Tuổi</dt><dd>${esc(tuoi)}</dd>
     <dt>Thẻ BHYT</dt><dd>${the?`<span class="badge ${conHan?"s-ok":"s-no"}">${conHan?"Còn hạn":"Hết hạn"} đến ${esc(the.han_den)}</span>`:'<span class="badge s-rv">Chưa có thông tin thẻ</span>'}</dd>
     <dt>Mức hưởng</dt><dd>${the&&the.muc_huong!=null?esc(the.muc_huong)+"%":"—"}</dd></dl></div>
   <div class="card"><div class="card-h"><h2>Sinh hiệu</h2></div><div class="vitals">
     <div><small>Nhiệt độ</small><b>${esc(sh.nhiet_do??"—")}</b><span>°C</span></div>
     <div><small>Mạch</small><b>${esc(sh.mach??"—")}</b><span>l/p</span></div>
     <div><small>Nhịp thở</small><b>${esc(sh.nhip_tho??"—")}</b><span>l/p</span></div></div></div>
   <div class="card"><div class="card-h"><h2>Chẩn đoán ICD</h2></div>${icd.map((x,i)=>`<span class="chip">${esc(x)}${icdTen[x]?` <small>${esc(icdTen[x])}</small>`:""}${sua?` <button class="link" data-xicd="${i}" aria-label="Xóa ${esc(x)}">×</button>`:""}</span>`).join("")
     ||(sua?"":'<span class="muted">(chưa nhập)</span>')}${sua?'<input type="text" id="icdin" autocomplete="off" placeholder="Tìm chẩn đoán theo mã hoặc tên (vd J18.9, viêm phổi)" style="width:100%;margin-top:6px">':""}</div>
   <div class="card"><div class="card-h"><h2>Phiếu khám</h2></div><div class="pk">${pk}</div></div>`;
}
function render(){
  const c=cur();
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",(b.dataset.m==="1")===tu));
  $("edit").hidden=!res;
  document.querySelectorAll("#lan button").forEach(b=>{b.classList.toggle("on",+b.dataset.l===lan);b.disabled=!lanCases(ca).some(x=>x.lan_tich===+b.dataset.l)});
  const loi=res&&res.a1&&res.a1.loi; $("a1warn").hidden=!loi; // thông báo không chặn: vẫn xác nhận được
  $("a1warn").textContent=loi?`AI chưa đọc được phiếu khám — các vế AI để chưa thấy (${loi}).`:"";
  const nh=(res&&res.nhac)||[]; $("nhac").hidden=!nh.length;
  $("nhac").innerHTML=nh.map(n=>`<div>${esc(n.noi_dung)} <details><summary>Căn cứ</summary>${(n.can_cu||[]).map(x=>{const y=canCu(x);return `<blockquote>“${esc(y.t)}”<cite>${esc(y.v)}</cite></blockquote>`}).join("")}</details></div>`).join("");
  const q = res&&sel!=null ? trichOf(res.dong[sel]) : null;
  $("left").innerHTML=leftCards(c, highlight(c.phieu_kham||"",q).full);
  if(!res){ // bước 1: chọn chỉ định
    $("rows").innerHTML=cds.map((r,i)=>`<tr class="row"><td class="cb"><input type="checkbox" data-t="${i}" ${tick[i]?"checked":""} aria-label="Kiểm tra ${esc(r.ten)}"></td>
      <td><div class="ten">${esc(r.ten)}</div><div class="ma">${esc(r.ma||"— chưa có mã")}</div></td><td class="muted" colspan="2">Chưa kiểm tra</td>
      <td>${tu?`<button class="link" data-xcd="${i}">Xóa</button>`:""}</td></tr>`).join("")
      +(tu?`<tr><td></td><td colspan="4"><input type="text" id="cdin" autocomplete="off" placeholder="Tìm dịch vụ (tên, mã, tên tắt như CTM, CRP), Enter để thêm" style="width:100%"></td></tr>`:"");
    $("sum").textContent=`${tick.filter(Boolean).length}/${tick.length} chỉ định · Lần tích ${lan}`;
    $("tip").textContent=tu?"Đọc bệnh án, nhập chẩn đoán và chỉ định rồi bấm \"Kiểm tra BHYT\".":"Tích các chỉ định cần kiểm tra rồi bấm \"Kiểm tra BHYT\"."; $("ok").hidden=true; return;
  }
  $("tip").textContent="Bấm một dòng để xem đoạn phiếu khám liên quan."; $("ok").hidden=false;
  $("rows").innerHTML=res.dong.map((r,i)=>{
    const s=st[i], k=stOf(r), tags=[...new Set((r.checklist||[]).flatMap(v=>v.diem_mo_ho||[]))];
    const pick = needReason(r,s) ? `<div class="picker" data-p="${i}"><span class="muted">Lý do (không bắt buộc):</span>${
      Object.entries(LYDO).map(([v,l])=>`<label><input type="radio" name="ly${i}" value="${v}" ${s.ly&&s.ly.loai===v?"checked":""}>${l}</label>`).join("")}${
      s.ly&&s.ly.loai==="khac"?`<input type="text" data-note="${i}" placeholder="ghi chú…" value="${esc(s.ly.ghi_chu||"")}">`:""}</div>`:"";
    return `<tr class="row ${k==="cc"?"tint":""} ${sel===i?"sel":""}" data-row="${i}">
      <td class="cb"><input type="checkbox" data-cb="${i}" ${s.chon?"checked":""} aria-label="BHYT ${esc(r.ten)}">${gy(r)==="tich"?'<span class="goiy" title="Trợ lý gợi ý">gợi ý</span>':""}</td>
      <td><div class="ten">${esc(r.ten)}</div><div class="ma">${esc(r.ma||"— chưa có mã")}</div></td>
      <td><span class="badge s-${k}">${esc(nhan(r))}</span></td>
      <td class="lydo">${esc(r.ly_do)}${tags.map(t=>`<span class="tag">cách hiểu tạm ${esc(t)}</span>`).join("")}${hs(r)}${pick}</td>
      <td><button class="link" data-why="${i}">Vì sao?</button></td></tr>`}).join("");
  $("sum").textContent=`${st.filter(s=>s.chon).length}/${st.length} dòng tích BHYT · Lần tích ${lan}`;
}
// căn cứ: định dạng can_cu của engine chưa chốt trong spec §8, hiển thị phòng thủ
function canCu(x){ if(typeof x==="string") return {t:x,v:""};
  return {t:x.nguyen_van||x.trich||(x.ma?"Có mã giá dịch vụ "+x.ma:""),
    v:[x.van_ban,x.phu_luc,x.stt!=null?"STT "+x.stt:"",x.ma_ky_thuat?"mã kỹ thuật "+x.ma_ky_thuat:"",x.trang!=null?"tr. "+x.trang:""].filter(Boolean).join(", ")}; }
function openDrawer(i){
  sel=i; const r=res.dong[i], k=stOf(r), c=cur(), h=highlight(c.phieu_kham||"",trichOf(r)), cl=r.checklist||[];
  $("drawer").innerHTML=`<div class="dh"><div><small>Vì sao?</small><b>${esc(r.ten)}</b></div><button class="close" aria-label="Đóng">×</button></div><div class="body">
    <span class="badge s-${k}">${esc(nhan(r))}</span> <span class="ma">${esc(r.ma||"— chưa có mã")}</span>
    <h3>Lý do</h3><div>${esc(r.ly_do)}</div>${hs(r)?`${hs(r)}<div class="muted">AI không thấy phiếu khám hay chẩn đoán nhắc tới lý do cho dịch vụ này. Đây không phải đánh giá chuyên môn: nếu chỉ định cần, hãy ghi lý do vào phiếu khám; kết quả BHYT ở trên không đổi.</div>`:""}
    <h3>Căn cứ (nguyên văn)</h3>${(r.can_cu||[]).length?r.can_cu.map(x=>{const y=canCu(x);return `<blockquote>${y.t?"“"+esc(y.t)+"”":""}<cite>${esc(y.v)}</cite></blockquote>`}).join(""):'<div class="muted">Không có điều kiện riêng cho dịch vụ này.</div>'}
    ${cl.length?`<h3>Kiểm tra từng vế</h3><div class="tbl"><table><thead><tr><th>Vế</th><th>Kết quả</th><th>Nguồn</th><th>Bằng chứng</th></tr></thead><tbody>${
      cl.map(v=>`<tr><td>${esc(v.id)} · ${esc(v.mo_ta)}${(v.diem_mo_ho||[]).map(m=>`<span class="tag">cách hiểu tạm ${esc(m)}</span>`).join("")}</td>
       <td class="r-${esc(v.ket_qua==="chua_du_du_lieu"?"chua_du":v.ket_qua)}">${KQ[v.ket_qua]||esc(v.ket_qua)}</td><td><span class="src">${esc(v.nguon_ket_qua)}</span></td><td>${esc(v.bang_chung)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <h3>Phiếu khám</h3>${h.sent?`<blockquote>${h.sent}<cite>Trích A1 (đã khớp nguyên văn), mở rộng trọn câu</cite></blockquote>`:'<div class="muted">Không có đoạn trích A1 cho dòng này.</div>'}
    <details><summary>Xem toàn văn phiếu khám</summary><blockquote>${h.full}</blockquote></details></div>`;
  document.body.classList.add("open"); render();
}
function closeDrawer(){document.body.classList.remove("open"); sel=null}

async function runCheck(){
  const c=cur(), cd=cds.filter((_,i)=>tick[i]);
  setErr("");
  if(!cd.length){setErr(tu?"Hãy thêm ít nhất một chỉ định.":"Hãy tích ít nhất một chỉ định.");return}
  sent={luot_kham:c.luot_kham,lan_tich:c.lan_tich,ngay_kham:c.ngay_kham,benh_nhan:c.benh_nhan,icd:[...icd],
        sinh_hieu:c.sinh_hieu||{},phieu_kham:c.phieu_kham||"",lich_su:c.lich_su||[],chi_dinh:cd};
  const b=$("chk"); b.disabled=true; b.innerHTML='<span class="spin"></span>Đang kiểm tra…';
  try{
    res=await post("/check",sent); closeDrawer(); $("log").hidden=true;
    st=res.dong.map(r=>({chon:gy(r)==="tich",ly:null}));
  }catch(e){setErr("Không kiểm tra được: "+e.message); res=null}
  b.disabled=false; b.textContent="Kiểm tra BHYT"; render();
}
async function confirmAll(){
  const bn=sent.benh_nhan;
  const dau_vao={tuoi:bn.tuoi_thang??bn.tuoi_ngay,the:bn.the,icd:sent.icd,sinh_hieu:sent.sinh_hieu,lich_su_da_dung:sent.lich_su};
  const dong=res.dong.map((r,i)=>({...r,phien_ban_rule:r.phien_ban_rule||res.phien_ban_rule,
    bac_si_chon:st[i].chon?"tich":"khong_tich",
    ly_do_bac_si:needReason(r,st[i])?(st[i].ly||{loai:null,ghi_chu:null}):null}));
  const miss=res.dong.filter((r,i)=>needReason(r,st[i])&&!st[i].ly).length;
  try{
    const j=await post("/confirm",{luot_kham:sent.luot_kham,lan_tich:sent.lan_tich,dau_vao,dong});
    $("miss").textContent=miss?`${miss} dòng chưa chọn lý do — vẫn ghi, ly_do_bac_si.loai = null.`:"";
    $("logtxt").textContent=`Đã ghi thêm ${j.ghi} dòng vào logs/xac-nhan.jsonl.`;
  }catch(e){$("miss").textContent="";$("logtxt").textContent="Không ghi được: "+e.message}
  $("log").hidden=false; $("log").scrollIntoView({behavior:"smooth"});
}

$("ca").onchange=e=>{ca=e.target.value;lan=lanCases(ca)[0].lan_tich;load()};
$("lan").onclick=e=>{const l=+e.target.dataset.l;if(l&&lanCases(ca).some(x=>x.lan_tich===l)){lan=l;load()}};
$("chk").onclick=runCheck; $("ok").onclick=confirmAll;
$("mode").onclick=e=>{const m=e.target.dataset.m;if(m!=null){tu=m==="1";load()}};
$("edit").onclick=()=>{res=null;st=[];closeDrawer();$("log").hidden=true;setErr("");render()};
// thêm chỉ định: chọn từ danh mục thì gửi kèm mã; gõ tự do thì ma=null, engine tự tra theo tên/bí danh
function addCd(v,e){ v=v.trim(); if(!v&&!e) return;
  cds.push(e?{ma:e.ma,ten:e.ten}:{ma:null,ten:v}); tick.push(true); render(); $("cdin").focus(); }
function addIcd(v){ v=v.trim().toUpperCase().replace(/\s+/g,"").replace(/[*+]$/,""); // mã ghi * hoặc + trong danh mục: hồ sơ/XML chỉ dùng phần mã
  if(!/^[A-Z]\d{2}(\.\d{1,2})?$/.test(v)) return; // không phải mã, không có gợi ý → giữ nguyên chữ đang gõ
  if(!icd.includes(v)) icd.push(v); render(); $("icdin").focus(); }

// xếp hạng gợi ý: trùng hẳn > bắt đầu bằng > mọi từ khớp đầu từ > chứa chuỗi > chứa đủ các từ; hòa thì tên ngắn trước
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase().trim();
const keys=e=>[...(e.ma?[[norm(e.ma),1],[norm(e.ma).replace(".",""),1]]:[]),[norm(e.ten),0],...(e.bi_danh||[]).map(b=>[norm(b),0])];
function score(ks,q,qt){ let best=0;
  for(const [t,laMa] of ks){
    let s=t===q?100:t.startsWith(q)?80:0;
    if(!s){ const w=t.split(/[^a-z0-9.]+/);
      s=qt.every(x=>w.some(y=>y.startsWith(x)))?60:t.includes(q)?40:qt.every(x=>t.includes(x))?20:0; }
    if(s) best=Math.max(best,s+laMa*5);
  } return best; }
const abc=new Map(); // chưa gõ gì → danh sách theo thứ tự abc (ICD theo mã, dịch vụ theo tên), sắp một lần
const macDinh=(list,by)=>{ if(abc.get(list)?.n!==list.length)
  abc.set(list,{n:list.length,v:[...list].sort((a,b)=>String(a[by]||"").localeCompare(String(b[by]||""),"vi"))}); return abc.get(list).v; };
function rank(list,q,by){ q=norm(q); if(!q) return macDinh(list,by); const qt=q.split(/\s+/);
  return list.map(e=>[score(e._k||(e._k=keys(e)),q,qt),e]).filter(x=>x[0])
    .sort((a,b)=>b[0]-a[0]||a[1].ten.length-b[1].ten.length).slice(0,12).map(x=>x[1]); }

const SUG={icdin:()=>[icdList,"ma"], cdin:()=>[dm,"ten"]}; let sg={id:null,items:[],k:0};
function showSugg(inp){ const b=$("sugg"), [list,by]=SUG[inp.id](); sg={id:inp.id,items:rank(list,inp.value,by),k:inp.value.trim()?0:-1}; // ô trống: chưa chọn sẵn dòng nào
  if(!sg.items.length){b.hidden=true;return}
  const r=inp.getBoundingClientRect(), w=Math.min(Math.max(r.width,380),innerWidth-16);
  Object.assign(b.style,{left:Math.max(8,Math.min(r.left,innerWidth-w-8))+"px",top:r.bottom+4+"px",width:w+"px"});
  b.innerHTML=""; sg.shown=0; more(60); b.scrollTop=0; b.hidden=false; }
// vẽ dần từng đợt: danh sách mặc định có tới ~15.000 mã, vẽ hết một lúc sẽ giật
function more(upto){ const b=$("sugg"), to=Math.min(sg.items.length,Math.max(upto,sg.shown+60));
  b.insertAdjacentHTML("beforeend",sg.items.slice(sg.shown,to).map((e,j)=>`<div role="option" data-k="${sg.shown+j}" class="${sg.shown+j===sg.k?"on":""}"><span class="ma">${esc(e.ma||"—")}</span><span>${esc(e.ten)}</span></div>`).join("")); sg.shown=to; }
$("sugg").addEventListener("scroll",e=>{ const b=e.target; if(sg.shown<sg.items.length&&b.scrollTop+b.clientHeight>b.scrollHeight-120) more(sg.shown+60) });
const hideSugg=()=>{$("sugg").hidden=true};
function pick(inp,e){ hideSugg(); inp.id==="icdin"?addIcd(e?e.ma:inp.value):addCd(inp.value,e); }
document.addEventListener("input",e=>{ if(SUG[e.target.id]) showSugg(e.target) });
document.addEventListener("keydown",e=>{ const inp=e.target; if(!SUG[inp.id]) return;
  const open=!$("sugg").hidden&&sg.id===inp.id, n=sg.items.length;
  if(open&&(e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); const dn=e.key==="ArrowDown"; sg.k=Math.max(0,Math.min(n-1,sg.k+(dn?1:-1))); if(sg.k>=sg.shown) more(sg.k+1);
    [...$("sugg").children].forEach((d,i)=>d.classList.toggle("on",i===sg.k)); $("sugg").children[sg.k].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); pick(inp,open&&sg.k>=0?sg.items[sg.k]:null); }
  else if(e.key==="Escape") hideSugg(); });
$("sugg").addEventListener("mousedown",e=>{ const d=e.target.closest("[data-k]"); if(!d) return; e.preventDefault();
  const inp=$(sg.id); if(inp) pick(inp,sg.items[+d.dataset.k]); });
document.addEventListener("focusout",e=>{ if(SUG[e.target.id]) hideSugg() });
document.addEventListener("focusin",e=>{ if(SUG[e.target.id]) showSugg(e.target) }); // bấm vào ô là hiện danh sách
addEventListener("scroll",e=>{ if(e.target!==$("sugg")) hideSugg() },true); // cuộn trong danh sách thì giữ
$("left").addEventListener("click",e=>{const i=e.target.dataset.xicd;if(i!=null){icd.splice(+i,1);render()}});
$("rows").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.t!=null){tick[+t.dataset.t]=t.checked;render()}
  else if(t.dataset.cb!=null){const i=+t.dataset.cb;st[i].chon=t.checked;if(!needReason(res.dong[i],st[i]))st[i].ly=null;render()}
  else if(t.type==="radio"){const i=+t.closest(".picker").dataset.p;st[i].ly={loai:t.value,ghi_chu:t.value==="khac"?"":null};render()}
});
$("rows").addEventListener("input",e=>{const i=e.target.dataset.note;if(i!=null)st[+i].ly.ghi_chu=e.target.value});
$("rows").addEventListener("click",e=>{
  const t=e.target;
  if(t.dataset.xcd!=null){const i=+t.dataset.xcd;cds.splice(i,1);tick.splice(i,1);render();return}
  if(!res) return;
  if(t.dataset.why!=null){openDrawer(+t.dataset.why);return}
  if(t.closest("input,.picker"))return;
  const tr=t.closest("tr.row"); if(tr){sel=+tr.dataset.row;render()}
});
$("drawer").addEventListener("click",e=>{if(e.target.closest(".close")){closeDrawer();render()}});
$("scrim").onclick=()=>{closeDrawer();render()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("open")){closeDrawer();render()}});

fetch("/danh-muc").then(r=>r.json()).then(j=>{dm=j}).catch(()=>{}); // không có gợi ý vẫn gõ tự do được
fetch("/icd").then(r=>r.json()).then(j=>{icdList=j; icdTen={}; j.forEach(e=>{const m=e.ma.replace(/[*+]$/,""); if(!icdTen[m]) icdTen[m]=e.ten}); if(tu&&!res) render()}).catch(()=>{});
fetch("/cases").then(r=>r.json()).then(j=>{
  cases=j; const ks=[...new Set(cases.map(c=>c.luot_kham))];
  $("ca").innerHTML=ks.map(k=>{const c=lanCases(k)[0];return `<option value="${esc(k)}">${esc(c.id)} · ${esc(c.ten)}</option>`}).join("");
  ca=ks[0]; lan=lanCases(ca)[0].lan_tich; load();
}).catch(e=>{$("left").innerHTML='<div class="card err">Không tải được danh sách ca: '+esc(e.message)+'</div>'});
</script>
</body>
</html>
