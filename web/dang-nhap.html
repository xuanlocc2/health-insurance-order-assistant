<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Trợ lý BHYT</title>
<link rel="icon" href="data:,">
<style>
:root{--text:#333;--muted:#666;--line:#ccc;--blue:#2f78c4;--blue-d:#2a5f96;--rv:#b35c00;--rv-bg:#fdf0d9;--no:#d0021b;--no-bg:#fde6e4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#f2f5f8;color:var(--text);font:14px/1.5 Arial,"Segoe UI",Helvetica,sans-serif}
main{width:100%;max-width:400px;background:#fff;border:1px solid #dde3e9;border-top:4px solid var(--blue);border-radius:4px;padding:24px}
h1{margin:0;font-size:22px;font-weight:600;color:var(--blue-d)}
.phu{margin:2px 0 20px;color:var(--muted);font-size:13px}
label{display:block;margin:0 0 4px;font-weight:600;font-size:13px}
select,input[type=password]{display:block;width:100%;height:40px;margin-bottom:14px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:inherit;font:inherit}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.camket{display:flex;gap:9px;align-items:flex-start;margin:4px 0 16px;padding:10px;border:1px solid #f0d9ad;border-radius:3px;background:var(--rv-bg);color:#6b3a00;font-size:13px;font-weight:400;cursor:pointer}
.camket input{flex:none;width:17px;height:17px;margin:1px 0 0}
button{width:100%;height:42px;border:0;border-radius:3px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--blue-d)}
button:disabled{opacity:.65;cursor:wait}
#loi{margin:0 0 14px;padding:8px 10px;border-radius:3px;background:var(--no-bg);color:var(--no);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Trợ lý BHYT</h1>
  <p class="phu">Bản dùng thử cho bác sĩ Trung tâm Nhi</p>
  <form id="form">
    <label for="tk">Tài khoản</label>
    <select id="tk" autocomplete="username">
      <option>bs01</option><option>bs02</option><option>bs03</option><option>bs04</option><option>bs05</option>
    </select>
    <label for="mk">Mật khẩu</label>
    <input type="password" id="mk" required autocomplete="current-password">
    <label class="camket"><input type="checkbox" id="camket" required><span>Tôi cam kết chỉ nhập dữ liệu giả, không nhập họ tên, mã hồ sơ hay thông tin thật của người bệnh.</span></label>
    <p id="loi" role="alert" hidden></p>
    <button id="nut">Đăng nhập</button>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("loi").hidden = true; $("nut").disabled = true;
  try {
    const r = await fetch("/dang-nhap", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({tai_khoan: $("tk").value, mat_khau: $("mk").value, cam_ket: $("camket").checked})});
    if (r.ok) { location.replace("/"); return; }
    const j = await r.json().catch(() => ({}));
    $("loi").textContent = typeof j.detail === "string" ? j.detail : "Không đăng nhập được. Vui lòng thử lại.";
  } catch { $("loi").textContent = "Không kết nối được máy chủ. Vui lòng thử lại."; }
  $("loi").hidden = false; $("nut").disabled = false;
});
</script>
</body>
</html>
